# Release the Android app on version tags (v*). Two ways in: a hand-pushed
# tag, or auto-tag.yml calling this workflow after a version bump lands on
# master (a tag pushed with GITHUB_TOKEN does NOT trigger `push: tags`, so the
# caller passes the tag in instead).
#
# Stage 4 (owner, 2026-09-30): the phone IS the server and the computer app is
# retired, so the release is the APK alone — no desktop binaries. The APK must
# be signed with the release key from the ANDROID_KEYSTORE_* secrets
# (android/README.md → Signing): the phone holds the only copy of the scans,
# and an APK signed with another key installs only after an uninstall, which
# wipes them. So there is NO debug-key fallback any more — without the secrets
# the job fails and nothing is published. auto-tag.yml must pass them with
# `secrets: inherit` — a called workflow sees no secrets otherwise.
name: release
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "tag to build and publish, e.g. v1.0.6"
        required: true
        type: string
    # Required in practice: the build fails without them (see above).
    secrets:
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
permissions:
  contents: write   # create the GitHub Release + upload assets (default token is read-only)
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The keystore lives ONLY in secrets (never in the repo). No fallback:
      # a debug-signed release would force an uninstall that wipes the scans.
      - name: Build release APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD are not set — refusing to release a debug-signed APK"
            {
              echo "## Release NOT built: the release signing key is missing"
              echo
              echo "The phone holds the only copy of the scans. An APK signed with any other"
              echo "key can only be installed after uninstalling, which deletes them — so"
              echo "this workflow no longer falls back to a debug key."
              echo
              echo "Fix once: run \`python scripts/make_android_keystore.py\` and add the"
              echo "ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS"
              echo "repository secrets (android/README.md → Signing), then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ks="$RUNNER_TEMP/cardscanner-release.p12"
          printf '%s' "$KS_B64" | base64 -d > "$ks"
          export ANDROID_KEYSTORE_PATH="$ks"
          export ANDROID_KEYSTORE_PASSWORD="$KS_PASS"
          export ANDROID_KEY_ALIAS="${KS_ALIAS:-cardscanner}"
          echo "### Android APK: signed with the release key" >> "$GITHUB_STEP_SUMMARY"
          ./gradlew --stacktrace :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/mtg-card-scanner-android.apk"
      - name: Show the signing certificate
        run: |
          apksigner=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs mtg-card-scanner-android.apk | tee signer.txt
          {
            echo
            echo '```'
            grep -E 'certificate DN|SHA-256' signer.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mtg-card-scanner-android.apk
          path: mtg-card-scanner-android.apk
          if-no-files-found: error
  publish:
    needs: [apk]
    # Only a release-signed APK is ever published (no empty release either).
    if: ${{ needs.apk.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: mtg-card-scanner-android.apk
