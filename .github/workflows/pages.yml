# Deploy docs/ (the download landing page) to GitHub Pages on every push.
# Requires: repo Settings -> Pages -> Source = "GitHub Actions", and a PUBLIC
# repo (Pages on private repos needs a paid plan; the page fetches the public
# Releases API anyway).
name: pages
on:
  push:
    branches: [master]
    paths: ["docs/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
