# Versions chosen for this build box and the Nord N200 (see android/README.md):
# CameraX 1.5.3 = newest Camera2-backed line (1.6 moved to CameraPipe, which
# nothing here can test) and it needs exactly compileSdk 35; AGP 8.13 is the
# newest that runs on Gradle 8.14.
[versions]
agp = "8.13.2"
kotlin = "2.1.21"
camerax = "1.5.3"
okhttp = "4.12.0"
opencvAndroid = "4.10.0"
opencvJvm = "4.9.0-0"
zxing = "3.5.3"
junit = "4.13.2"
coroutines = "1.9.0"

[libraries]
camerax-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
opencv-android = { module = "org.opencv:opencv", version.ref = "opencvAndroid" }
opencv-jvm = { module = "org.openpnp:opencv", version.ref = "opencvJvm" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
junit = { module = "junit:junit", version.ref = "junit" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
json = { module = "org.json:json", version = "20240303" }
androidx-core = { module = "androidx.core:core-ktx", version = "1.15.0" }
androidx-activity = { module = "androidx.activity:activity-ktx", version = "1.9.3" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.0" }
androidx-lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.8.7" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
