<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Scanner — Control</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115; --panel: #12141a; --card: #171a21; --line: #23262e;
    --text: #e8eaed; --muted: #8b93a1; --dim: #6b7280;
    --accent: #3b82f6; --good: #6ee7a0; --warn: #fbbf24; --bad: #ff8a8a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }

  /* ── header ─────────────────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; white-space: nowrap; }
  header .sp { flex: 1; }
  .stat { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .stat b { color: var(--text); }
  .stat .money { color: var(--good); }
  .btn { font: inherit; padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
  .btn.ghost { background: var(--line); color: #cbd2dc; }
  .btn.danger { background: #3a1c1c; color: var(--bad); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.sm { padding: 5px 10px; font-size: 13px; }

  main { display: grid; grid-template-columns: 400px 1fr; height: calc(100dvh - 53px); }
  #left { border-right: 1px solid var(--line); overflow-y: auto; }
  #right { overflow-y: auto; padding: 18px 20px 60px; }

  /* ── filters ────────────────────────────────────────────────────────── */
  .toolbar { padding: 10px 12px; position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 2; }
  .toolbar input, .toolbar select {
    padding: 8px 10px; border-radius: 8px; border: 1px solid #2a2f3a;
    background: var(--bg); color: var(--text); font: inherit;
  }
  .toolbar .full { width: 100%; }
  .frow { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .frow .price { width: 82px; }
  .chipbar { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .fchip { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--line);
           color: #cbd2dc; cursor: pointer; border: 1px solid transparent; }
  .fchip.on { background: #1c2740; border-color: var(--accent); color: #cfe1ff; }

  /* ── scan list ──────────────────────────────────────────────────────── */
  .row { display: flex; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #1b1e26; cursor: pointer; align-items: center; }
  .row:hover { background: #171a21; }
  .row.active { background: #1c2740; }
  .row img { width: 42px; height: 59px; object-fit: cover; border-radius: 4px; background: var(--line); flex: 0 0 auto; }
  .row .meta { flex: 1; min-width: 0; }
  .row .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: 0 0 auto; }
  .price { color: var(--good); font-weight: 700; font-size: 13px; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--line); color: #aeb4bf; }
  .pill.sel { background: #14532d; color: #86efac; }
  .pill.cand { background: #3f2d10; color: var(--warn); }
  .pill.err { background: #3a1c1c; color: var(--bad); }
  .row input[type=checkbox] { width: 18px; height: 18px; flex: 0 0 auto; }
  .empty { color: var(--dim); text-align: center; padding: 40px 20px; }

  /* ── detail ─────────────────────────────────────────────────────────── */
  h2 { font-size: 15px; margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .dhead { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 16px; }
  .scanshot { width: 168px; flex: 0 0 auto; }
  .scanshot img { width: 100%; border-radius: 10px; background: var(--line); cursor: zoom-in; display: block; }
  .scanshot .cap { font-size: 11px; color: var(--dim); text-align: center; margin-top: 4px; }
  .dinfo { flex: 1; min-width: 0; }
  .dname { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .dsub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .bigprice { font-size: 26px; font-weight: 800; color: var(--good); margin: 10px 0 2px; }
  .controls { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin: 14px 0; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  select, .qty { padding: 7px 9px; border-radius: 8px; border: 1px solid #2a2f3a; background: var(--bg); color: var(--text); font: inherit; }
  .qty { width: 72px; }
  table.prices { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
  table.prices td { padding: 2px 14px 2px 0; color: var(--muted); }
  table.prices td.v { color: var(--text); font-weight: 600; }
  .f2fbox { margin: 10px 0 4px; padding: 10px 14px; border: 1px solid var(--line);
            border-radius: 10px; background: var(--card); max-width: 560px; }
  .f2fbox .boxlabel { font-size: 11px; letter-spacing: .08em; color: var(--muted);
                      margin-bottom: 4px; }
  .f2fbox .bigprice { margin: 4px 0 2px; }

  .sec { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
  .sechead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card { border: 2px solid transparent; border-radius: 10px; background: var(--card); padding: 8px; cursor: pointer; transition: border-color .1s, transform .1s; }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card.chosen { border-color: #22c55e; }
  .card img { width: 100%; border-radius: 6px; display: block; background: var(--line); aspect-ratio: 5/7; object-fit: cover; }
  .card .t { font-size: 12px; margin-top: 6px; line-height: 1.35; }
  .card .t b { display: block; }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  a { color: #7cc4ff; }
  .searchrow { display: flex; gap: 8px; max-width: 460px; }
  .searchrow input { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #2a2f3a; background: var(--bg); color: var(--text); font: inherit; }

  /* ── lightbox ───────────────────────────────────────────────────────── */
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.93); z-index: 40; display: none;
              align-items: center; justify-content: center; cursor: zoom-out; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 12px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
           background: var(--card); border: 1px solid var(--line); padding: 10px 18px;
           border-radius: 10px; z-index: 50; display: none; }
  .toast.show { display: block; }
</style>
</head>
<body>
<header>
  <h1>🃏 MTG Card Scanner</h1>
  <span class="stat" id="dver" style="font-size:11px"></span>
  <span id="updBanner" style="display:none;align-items:center;gap:8px">
    <span class="stat" style="color:var(--good)" id="updText"></span>
    <button class="btn sm" id="updBtn">Update &amp; restart</button>
  </span>
  <span class="pill" id="phoneLink" style="cursor:pointer" title="Click for a QR code to open the scanner on your phone"></span>
  <span class="sp"></span>
  <span class="stat" id="sweepStat" style="color:var(--warn)"></span>
  <button class="btn ghost sm" id="f2fLogBtn" title="F2F request log — every request's outcome and the adaptive pace">🐞</button>
  <button class="btn ghost sm" id="sweepStartBtn" style="display:none" title="Start a pricing sweep now (also overrides a throttling cooldown)">▶ Sweep</button>
  <button class="btn ghost sm" id="sweepStopBtn" style="display:none" title="Stop the price sweep (auto-sweep pauses 10 min; it restarts within a minute of pressing the phone's Price missing)">■ Stop</button>
  <span class="stat" id="stats">—</span>
  <button class="btn ghost" id="dlBtn" title="Card database & image downloads">⬇</button>
  <button class="btn ghost" id="refreshBtn" title="Reload now">↻</button>
  <button class="btn ghost" id="clearJunkBtn" title="Delete every scan that has no chosen printing">Clear unpicked</button>
  <button class="btn danger" id="clearAllBtn" title="Delete every scan">Clear all</button>
  <button class="btn" id="exportBtn">Export to Mana Exchange</button>
</header>
<div id="f2fLog" style="display:none;position:fixed;right:14px;bottom:14px;width:560px;
     max-height:55vh;overflow:auto;background:var(--panel);border:1px solid var(--line);
     border-radius:10px;padding:10px 12px;z-index:60;font:12px/1.6 ui-monospace,Consolas,monospace"></div>
<div id="dlBar" style="display:none;flex-direction:column;gap:8px;padding:12px 16px;
     background:var(--panel);border-bottom:1px solid var(--line);font-size:13px">
  <div><b>Card database</b> <span class="muted">(identifies cards — required)</span>
    <span id="dlIndexInfo" class="muted"></span>
    <button class="btn sm" id="dlIndexBtn" style="margin-left:10px">Build</button>
    </div>
  <div><b>Card images</b> <span class="muted">(every printing's image, ~10&nbsp;GB — makes ranking &amp; pick grids instant/offline; optional, resumable)</span>
    <span id="dlImgInfo" class="muted"></span>
    <button class="btn sm" id="dlImgBtn" style="margin-left:10px">Download all</button>
    </div>
</div>
<main>
  <div id="left">
    <div class="toolbar">
      <input id="filter" class="full" placeholder="Filter by name or set…">
      <div class="frow">
        <input id="pmin" class="price" type="number" min="0" step="0.25" placeholder="Min $">
        <input id="pmax" class="price" type="number" min="0" step="0.25" placeholder="Max $">
        <button class="btn ghost sm" id="exclBtn" title="Exclude every priced card outside the range from the export (reversible per card)">Exclude filtered</button>
      </div>
      <div class="chipbar">
        <span class="fchip on" data-view="all">All</span>
        <span class="fchip" data-view="pending">Needs pick</span>
        <span class="fchip" data-view="selected">Selected</span>
        <span class="fchip" data-view="problem">Problems</span>
      </div>
    </div>
    <div id="list"></div>
  </div>
  <div id="right"><div class="empty">Scan a card on your phone to begin.</div></div>
</main>
<div id="lightbox"><img id="lightboxImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
const CONDITIONS = ["NM","LP","MP","HP","DMG"];
const FINISHES = ["Non-Foil","Foil","Etched"];
let scans = [], focusedId = null, lastMaxId = 0, detailSig = "", listSig = "";
let filterText = "", priceMin = null, priceMax = null, view = "all";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function jget(u){ return (await fetch(u)).json(); }
async function jsend(u,m,b){ return (await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json(); }

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ── pricing helpers ───────────────────────────────────────────────────── */
function f2fBest(scan){
  const c = scan.f2f?.conditions || {};
  const cond = scan.selection?.condition || "NM";
  const order = { NM:["NM","PL"], LP:["PL","NM"], MP:["MP","PL","NM"], HP:["HP","PL","NM"], DMG:["DMG","HP","PL","NM"] }[cond] || ["NM"];
  for (const k of order) if (c[k]!=null) return c[k];
  const vals = Object.values(c); return vals.length ? Math.min(...vals) : null;
}
// Low–high across every listed condition — shown for pending scans too, since
// Per-print F2F data on an unpicked scan (filled by the auto-sweeper).
// searched is true once EVERY candidate print has a completed search — only
// then may the price filter hide the card.
function printInfo(s){
  const cands = s.candidates || [];
  const searched = cands.length > 0 && cands.every(c => c.f2f_conditions != null);
  const vals = [];
  for (const c of cands){
    const v = Object.values(c.f2f_conditions || {});
    if (v.length) vals.push(Math.min(...v));
  }
  return { searched, vals };
}

// the server prices the top-ranked printing in the background at scan time.
function priceRange(scan){
  if (scan.status !== "selected"){
    const { vals } = printInfo(scan);
    if (vals.length){
      const lo = Math.min(...vals), hi = Math.max(...vals);
      return lo === hi ? `$${lo.toFixed(2)}` : `$${lo.toFixed(2)}–$${hi.toFixed(2)}`;
    }
  }
  const vals = Object.values(scan.f2f?.conditions || {});
  if (!vals.length) return null;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  return lo === hi ? `$${lo.toFixed(2)}` : `$${lo.toFixed(2)}–$${hi.toFixed(2)}`;
}
function priceOf(scan){
  if (scan.status !== "selected" || !scan.f2f) return null;
  const p = f2fBest(scan);
  return p == null ? null : Number(p);
}
const inBand = p => (priceMin == null || p >= priceMin) && (priceMax == null || p <= priceMax);
function inPriceRange(scan){
  // A "check" row means the scan needs human eyes — no filter may ever
  // hide one, whatever the price band says.
  if (isProblem(scan)) return true;
  if (priceMin == null && priceMax == null) return true;
  if (scan.status === "selected"){
    const p = priceOf(scan);
    return p == null ? true : inBand(p);   // unpriced never disappears
  }
  // Unpicked: hidden only when EVERY print it could be has been searched and
  // none falls in the band — partial knowledge never hides a card.
  const { searched, vals } = printInfo(scan);
  if (!searched || !vals.length) return true;
  return vals.some(inBand);
}

function thumbFor(scan){
  return scan.selection?.image_normal
      || scan.candidates?.[0]?.image_small
      || scan.candidates?.[0]?.image_normal
      || `/api/scans/${scan.id}/image`;
}
function titleFor(scan){ return scan.selection?.name || scan.card_read?.name || "(unidentified)"; }
function isProblem(scan){ return !!scan.error || !(scan.candidates||[]).length; }

/* ── list ──────────────────────────────────────────────────────────────── */
function visibleScans(){
  const q = filterText.toLowerCase();
  return scans.filter(s => {
    if (!inPriceRange(s)) return false;
    if (view === "pending"  && s.status === "selected") return false;
    if (view === "selected" && s.status !== "selected") return false;
    if (view === "problem"  && !isProblem(s)) return false;
    if (!q) return true;
    const hay = (titleFor(s)+" "+(s.selection?.set||s.card_read?.set_code||"")).toLowerCase();
    return hay.includes(q);
  });
}

function renderList(){
  const rows = visibleScans();
  // Sig must cover every rendered field: selection identity (re-picks swap
  // name/set/number), condition/finish edits (the phone can PATCH these), etc.
  const sig = rows.map(s => [s.id,s.status,s.included,s.selection?.quantity,
    s.selection?.scryfall_id,s.selection?.condition,s.selection?.finish,
    s.card_read?.name,s.error?'e':'',
    s.selection?.auto_picked?'a':'',JSON.stringify(s.f2f?.conditions||{}),
    printInfo(s).vals.join(";"),s.id===focusedId].join("~")).join("|");
  if (sig === listSig) { updateStats(); return; }
  listSig = sig;

  $("#list").innerHTML = rows.map(s => {
    const sel = s.status === "selected";
    const pr = priceRange(s);
    const sub = sel
      ? `${(s.selection.set||"").toUpperCase()} #${s.selection.collector_number} · ${s.selection.condition} · ${s.selection.finish}`
      : `${(s.candidates||[]).length} printings`;
    const pill = sel
      ? `<span class="pill sel" ${s.selection?.auto_picked ? 'title="auto-picked — only printing"' : ''}>${s.selection?.auto_picked ? '⚠ auto' : 'selected'}</span>`
      : isProblem(s) ? `<span class="pill err">check</span>`
      : `<span class="pill cand">pick</span>`;
    return `<div class="row ${s.id===focusedId?'active':''}" data-id="${s.id}">
      <img src="${esc(thumbFor(s))}" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="meta">
        <div class="nm">${esc(titleFor(s))}</div>
        <div class="sub">${esc(sub)}</div>
        <div style="margin-top:4px">${pill}${sel?`<span class="pill">×${s.selection.quantity}</span>`:''}</div>
      </div>
      <div class="right">
        ${pr?`<span class="price">${pr}</span>`:''}
        ${sel?`<input type="checkbox" title="include in export" ${s.included?'checked':''} data-inc="${s.id}">`:''}
      </div>
    </div>`;
  }).join("") || `<div class="empty">No scans match.</div>`;

  $("#list").querySelectorAll(".row").forEach(r =>
    r.addEventListener("click", e => {
      if (e.target.dataset.inc) return;
      focusScan(Number(r.dataset.id));
    }));
  $("#list").querySelectorAll("[data-inc]").forEach(cb =>
    cb.addEventListener("change", async () => {
      await jsend(`/api/scans/${cb.dataset.inc}`, "PATCH", { included: cb.checked });
      poll();
    }));
  updateStats();
}

function updateStats(){
  const sel = scans.filter(s => s.status==="selected");
  const inc = sel.filter(s => s.included);
  // quantity matters: an auto-merged x3 row exports 3 copies
  const total = inc.reduce((t,s) => t + (priceOf(s) ?? 0) * (s.selection?.quantity || 1), 0);
  $("#stats").innerHTML =
    `<b>${scans.length}</b> scans · <b>${scans.length-sel.length}</b> to pick · ` +
    `<b>${inc.length}</b> to export · <span class="money">$${total.toFixed(2)}</span>`;
  $("#exportBtn").disabled = inc.length === 0;
}

function focusScan(id){ focusedId = id; detailSig = ""; renderDetail(); listSig=""; renderList(); }

/* ── candidate cards ───────────────────────────────────────────────────── */
function candCard(c, chosenId, idx){
  const badges = (c.finishes||[]).map(f=>`<span class="pill">${esc(f)}</span>`).join("");
  // multi = art×4 + title + textbox — the order candidates are shown in.
  const d = c.multi_distance!=null
    ? `<span class="pill" title="combined match: art×4 + title + textbox (lower = closer)">Δ${c.multi_distance}</span>`
    : (c.phash_distance!=null ? `<span class="pill">art Δ${c.phash_distance}</span>` : "");
  const best = idx===0 ? `<span class="pill" style="background:#1c2740;color:#cfe1ff">closest</span>` : "";
  const ocr = c.ocr_confirmed ? `<span class="pill" style="background:#14532d;color:#86efac" title="the set code printed on your card's bottom line matches this printing">✓ matches card text</span>` : "";
  return `<div class="card ${c.id===chosenId?'chosen':''}" data-pick="${esc(c.id)}">
    <img src="${esc(c.image_normal||c.image_small)}" loading="lazy" onerror="this.style.visibility='hidden'">
    <div class="t"><b>${esc(c.set_name)}</b>#${esc(c.collector_number)} · ${esc(c.rarity||"")}</div>
    <div class="badges">${ocr}${best}${d}${badges}</div>
  </div>`;
}

function controlsHtml(scan){
  const condDefault = scan.selection?.condition || (scan.card_read?.condition_estimate||"").toUpperCase();
  const cond = CONDITIONS.includes(condDefault) ? condDefault : "NM";
  const fin = scan.selection?.finish || (scan.card_read?.foil ? "Foil" : "Non-Foil");
  const qty = scan.selection?.quantity || 1;
  return `<div class="controls">
    <div class="field">Condition
      <select id="c-cond">${CONDITIONS.map(c=>`<option ${c===cond?'selected':''}>${c}</option>`).join("")}</select></div>
    <div class="field">Finish
      <select id="c-fin">${FINISHES.map(f=>`<option ${f===fin?'selected':''}>${f}</option>`).join("")}</select></div>
    <div class="field">Qty <input class="qty" id="c-qty" type="number" min="1" value="${qty}"></div>
  </div>`;
}

/* ── F2F price panel ───────────────────────────────────────────────────── */
// One visible home for Face to Face pricing: what the price is (or that
// there isn't one yet), which printing it was searched for, and a button to
// run the search on demand — pricing used to happen invisibly in the
// background with no way to see or retry it per card.
function f2fBoxHtml(scan){
  const sel = scan.selection || null;
  const rows = Object.entries(scan.f2f?.conditions||{});
  let inner;
  if (rows.length){
    const forLabel = !sel && scan.f2f?.name
      ? ` <span class="muted" style="font-size:12px;font-weight:400">top match: ${esc(scan.f2f.name)} [${esc((scan.f2f.set_code||'').toUpperCase())}]</span>`
      : '';
    inner = `<div class="bigprice">${sel ? `$${f2fBest(scan) ?? '—'}` : `~${priceRange(scan)}`}${forLabel}</div>
      <table class="prices"><tr>${rows.map(([k])=>`<td>${esc(k)}</td>`).join("")}</tr>
      <tr>${rows.map(([,v])=>`<td class="v">$${Number(v).toFixed(2)}</td>`).join("")}</tr></table>
      ${scan.f2f?.url?`<a href="${esc(scan.f2f.url)}" target="_blank">View on Face to Face ↗</a>`:''}`;
  } else if (!sel && printInfo(scan).vals.length){
    // Pending scan with sweeper-filled per-print prices but no top-match f2f.
    inner = `<div class="bigprice">~${priceRange(scan)} <span class="muted" style="font-size:13px;font-weight:400">(across its printings)</span></div>`;
  } else {
    inner = `<div class="muted" style="font-size:13px;margin:4px 0">${
      scan.f2f ? 'No Face to Face listing found.' : 'Not priced yet.'}</div>`;
  }
  return `<div class="f2fbox">
    <div class="boxlabel">FACE TO FACE PRICE</div>
    ${inner}
    <div style="margin-top:8px">
      <button class="btn ghost sm" id="f2fSearchBtn">↻ Search F2F price</button>
      <span class="muted" style="font-size:12px;margin-left:8px" id="f2fStatus"></span>
    </div>
  </div>`;
}

/* ── detail ────────────────────────────────────────────────────────────── */
function renderDetail(){
  const scan = scans.find(s => s.id === focusedId);
  const right = $("#right");
  if (!scan){ right.innerHTML = `<div class="empty">Scan a card on your phone to begin.</div>`; return; }
  const cr = scan.card_read || {}, sel = scan.selection || null;
  const chosenId = sel?.scryfall_id;

  let html = `<div class="dhead">
    <div class="scanshot">
      <img src="/api/scans/${scan.id}/image" id="scanShot" onerror="this.parentNode.style.display='none'">
      <div class="cap">your card · click to enlarge</div>
    </div>
    <div class="dinfo">
      <div class="dname">${esc(titleFor(scan))}${sel?.auto_picked ? ` <span title="auto-picked — this card has only one printing; glance to confirm" style="color:var(--warn);font-size:16px;cursor:help">⚠</span>` : ''}</div>
      <div class="dsub">${sel
        ? `${esc(sel.set_name)} · ${esc((sel.set||'').toUpperCase())} #${esc(sel.collector_number)}`
        : `matched by art as <b>${esc(cr.name||'?')}</b> — pick the exact printing below`}</div>
      ${(cr.alternates||[]).length ? `<div class="dsub">also possible: ${
        cr.alternates.map(a=>`<a href="#" class="alt-name" data-name="${esc(a.name)}">${esc(a.name)}</a> <span class="muted">(Δ${a.distance})</span>`).join(" · ")
      }</div>` : ''}
      ${scan.error ? `<div class="dsub" style="color:var(--bad)">⚠ ${esc(scan.error)}</div>` : ''}
      ${f2fBoxHtml(scan)}
      ${controlsHtml(scan)}
    </div>
  </div>`;

  html += `<div class="sec">
    <div class="sechead"><h2>${sel?"Re-pick printing":"Pick the printing"}</h2>
      <span class="muted" style="font-size:12px">ranked closest first — art ×4 + title + textbox</span></div>`;
  html += (scan.candidates||[]).length
    ? `<div class="grid" id="cands">${scan.candidates.map((c,i)=>candCard(c,chosenId,i)).join("")}</div>`
    : `<p class="muted">No art candidates — use the search below.</p>`;
  html += `</div>`;

  html += `<div class="sec">
    <div class="sechead"><h2>Wrong card?</h2><span class="muted" style="font-size:12px">search by name</span></div>
    <div class="searchrow">
      <input id="msearch" placeholder="Card name…">
      <button class="btn ghost" id="msearchBtn">Search</button>
    </div>
    <div class="grid" id="msearchResults" style="margin-top:12px"></div>
  </div>`;

  html += `<div class="sec"><button class="btn danger" id="delBtn">Delete this scan</button></div>`;

  right.innerHTML = html;
  right.scrollTop = 0;
  wireDetail(scan);
}

function currentControls(){
  return {
    condition: $("#c-cond")?.value || "NM",
    finish: $("#c-fin")?.value || "Non-Foil",
    quantity: Number($("#c-qty")?.value || 1),
  };
}

function wireDetail(scan){
  // data-pick holds only the candidate id — the printing object is looked up
  // from memory (embedding JSON in an HTML attribute broke on names/sets
  // containing quotes, e.g. "Battle for Baldur's Gate").
  const pickFrom = (pool) => async (el) => {
    const printing = (pool || []).find(c => c.id === el.dataset.pick);
    if (!printing) return;
    el.style.opacity = ".5";
    const res = await jsend(`/api/scans/${scan.id}/select`, "POST", { printing, ...currentControls() });
    if (res.merged_into){
      // Duplicate copy — folded into the existing row; follow it there. Say
      // so when that row is export-excluded, or the copy silently vanishes
      // from the export with a toast implying it was filed.
      focusedId = res.merged_into;
      toast(`Duplicate — merged into existing entry (now ×${res.selection?.quantity})`
            + (res.included === false ? ' — NOTE: that row is excluded from export' : ''));
    } else {
      toast(`Selected ${printing.set_name} #${printing.collector_number}`);
    }
    await poll(); detailSig=""; renderDetail(); listSig=""; renderList();
  };
  const candPick = pickFrom(scan.candidates);
  $("#cands")?.querySelectorAll(".card[data-pick]").forEach(el =>
    el.addEventListener("click", () => candPick(el)));

  $("#scanShot")?.addEventListener("click", () => openLightbox(`/api/scans/${scan.id}/image`));

  // On-demand F2F price search with a visible in-flight state.
  $("#f2fSearchBtn")?.addEventListener("click", async () => {
    const btn = $("#f2fSearchBtn"), st = $("#f2fStatus");
    btn.disabled = true; st.textContent = "Searching Face to Face…";
    try {
      const updated = await jsend(`/api/scans/${scan.id}/price`, "POST", {});
      // NOTE: on success this returns the full scan row, whose stored `error`
      // column may carry an old art-match warning — success is "row came
      // back", not "error field empty".
      if (updated.f2f_search === "sweeping"){
        st.textContent = "Sweep in progress — this card will be priced by it."; btn.disabled = false;
      } else if (updated.f2f_search === "not_found"){
        st.textContent = "No listing found on Face to Face."; btn.disabled = false;
      } else if (updated.f2f_search === "unavailable"){
        st.textContent = "Face to Face unreachable — try again."; btn.disabled = false;
      } else if (!updated.id){
        st.textContent = updated.error || "Search failed."; btn.disabled = false;
      } else {
        await poll(); detailSig=""; renderDetail(); listSig=""; renderList();
        toast("Price updated");
      }
    } catch(e){
      st.textContent = "Search failed: " + e.message; btn.disabled = false;
    }
  });

  // Live edit of an already-selected scan when controls change.
  if (scan.status === "selected"){
    ["c-cond","c-fin","c-qty"].forEach(id => {
      document.getElementById(id)?.addEventListener("change", async () => {
        await jsend(`/api/scans/${scan.id}`, "PATCH", currentControls());
        await poll(); detailSig=""; renderDetail(); listSig=""; renderList();
      });
    });
  }

  const doSearch = async () => {
    const q = $("#msearch").value.trim(); if (!q) return;
    $("#msearchResults").innerHTML = `<p class="muted">Searching…</p>`;
    const { candidates } = await jget(`/api/search?q=${encodeURIComponent(q)}`);
    $("#msearchResults").innerHTML = candidates.map((c,i)=>candCard(c,scan.selection?.scryfall_id,-1)).join("")
      || `<p class="muted">No results.</p>`;
    const searchPick = pickFrom(candidates);
    $("#msearchResults").querySelectorAll(".card[data-pick]").forEach(el =>
      el.addEventListener("click", () => searchPick(el)));
  };
  $("#msearchBtn")?.addEventListener("click", doSearch);
  $("#msearch")?.addEventListener("keydown", e => { if (e.key==="Enter") doSearch(); });

  // Alternate name guesses from the art index → one click reruns the search.
  $("#right").querySelectorAll(".alt-name").forEach(a =>
    a.addEventListener("click", e => {
      e.preventDefault();
      $("#msearch").value = a.dataset.name;
      doSearch();
      $("#msearch").scrollIntoView({ behavior: "smooth", block: "center" });
    }));

  $("#delBtn")?.addEventListener("click", async () => {
    await fetch(`/api/scans/${scan.id}`, { method: "DELETE" });
    focusedId = null; await poll(); renderDetail();
    toast("Scan deleted");
  });
}

/* ── lightbox ──────────────────────────────────────────────────────────── */
function openLightbox(src){ $("#lightboxImg").src = src; $("#lightbox").classList.add("open"); }
$("#lightbox").addEventListener("click", () => $("#lightbox").classList.remove("open"));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("#lightbox").classList.remove("open");
});

/* ── polling ───────────────────────────────────────────────────────────── */
function sigOf(scan){
  if (!scan) return "none";
  return [scan.id, scan.status, (scan.candidates||[]).length,
          scan.selection?.scryfall_id, scan.selection?.condition, scan.selection?.finish,
          scan.selection?.quantity, scan.selection?.auto_picked, scan.error,
          scan.f2f ? JSON.stringify(scan.f2f.conditions||{}) : "null",
          printInfo(scan).vals.join(";"), scan.included].join("|");
}

// Version banner — page version · server git hash. Same rationale as the
// phone: without it, "is this the old page?" is undebuggable.
const UI_VERSION = "d16";
$("#sweepStopBtn").addEventListener("click", async () => {
  await jsend("/api/price-sweep/stop", "POST", {});
  toast("Sweep stopping — auto-sweep paused 10 min");
  poll();
});
jget("/api/version").then(d => { $("#dver").textContent = `${UI_VERSION} · ${d.version}`; })
  .catch(() => { $("#dver").textContent = UI_VERSION; });

/* ── in-app update: banner + one-click update-and-restart ────────────────── */
async function checkForUpdate(){
  try {
    const u = await jget("/api/update-check");
    if (!u.update_available) return;
    $("#updBanner").style.display = "inline-flex";
    $("#updText").textContent = `⬆ update available (${u.current} → ${u.latest})`;
    if (!u.can_self_update){
      $("#updBtn").textContent = "Download new version";
      $("#updBtn").onclick = () => window.open(u.download_url, "_blank");
    }
  } catch(e){ /* offline / rate-limited — try again next hour */ }
}
$("#updBtn").addEventListener("click", async () => {
  if ($("#updBtn").textContent.startsWith("Download")) return;   // frozen build path
  $("#updBtn").disabled = true;
  const before = (await jget("/api/version").catch(()=>({version:""}))).version;
  await jsend("/api/update", "POST", {}).catch(()=>{});
  $("#updText").textContent = "updating — the server is restarting…";
  // Poll until the server is back with a DIFFERENT version, then reload.
  const t0 = Date.now();
  const poll = setInterval(async () => {
    try {
      const v = (await jget("/api/version")).version;
      if (v && v !== before){ clearInterval(poll); location.reload(); }
    } catch(e){ /* still restarting */ }
    if (Date.now() - t0 > 180000){                    // 3 min — give up gracefully
      clearInterval(poll);
      $("#updText").textContent = "update taking long — refresh manually when it returns";
    }
  }, 2000);
});
checkForUpdate();
setInterval(checkForUpdate, 3600 * 1000);

async function poll(){
  try {
    const [scansData, sweep] = await Promise.all([
      jget("/api/scans"), jget("/api/price-status")]);
    scans = scansData;
    // Live sweep readout: which card the background pricer is searching on
    // F2F right now, progress, and measured ETA — it was invisible before.
    const ss = $("#sweepStat");
    if (sweep.active){
      ss.style.color = "var(--warn)";
      ss.textContent = sweep.cancelling ? `⟳ stopping…`
        : `⟳ pricing ${sweep.done}/${sweep.total} — ${sweep.current || "…"}`
          + (sweep.eta_s != null ? ` (~${sweep.eta_s}s left` : "")
          + (sweep.pace_s ? ` · pace 1/${sweep.pace_s}s` : "")
          + (sweep.eta_s != null ? `)` : "");
    } else if (sweep.cooldown_s > 0){
      ss.style.color = "var(--warn)";
      ss.textContent = `⏸ F2F throttled — auto-sweep resumes in ${sweep.cooldown_s}s (▶ overrides)`;
    } else if (sweep.next_check_s != null){
      ss.style.color = "var(--dim)";
      ss.textContent = `next price check in ~${sweep.next_check_s}s`;
    } else {
      ss.textContent = "";
    }
    $("#sweepStopBtn").style.display = sweep.active && !sweep.cancelling ? "" : "none";
    $("#sweepStartBtn").style.display = !sweep.active ? "" : "none";
    const maxId = scans.reduce((m,s)=>Math.max(m,s.id), 0);
    if (maxId > lastMaxId){ focusedId = maxId; lastMaxId = maxId; detailSig = ""; }
    renderList();
    const focused = scans.find(s => s.id === focusedId);
    const sig = sigOf(focused);
    if (sig !== detailSig){ detailSig = sig; renderDetail(); }
  } catch (e) { /* server momentarily unreachable */ }
}

/* ── filters + actions ─────────────────────────────────────────────────── */
$("#filter").addEventListener("input", e => { filterText = e.target.value; listSig=""; renderList(); });
$("#pmin").addEventListener("input", e => { priceMin = e.target.value === "" ? null : Number(e.target.value); listSig=""; renderList(); });
$("#pmax").addEventListener("input", e => { priceMax = e.target.value === "" ? null : Number(e.target.value); listSig=""; renderList(); });
document.querySelectorAll(".fchip").forEach(chip =>
  chip.addEventListener("click", () => {
    document.querySelectorAll(".fchip").forEach(c => c.classList.remove("on"));
    chip.classList.add("on"); view = chip.dataset.view; listSig=""; renderList();
  }));

$("#exclBtn").addEventListener("click", async () => {
  // Bulk-exclude everything the price filter hides (priced, out of range,
  // still included). Reversible per card via its include checkbox.
  const targets = scans.filter(s =>
    s.status === "selected" && s.included && priceOf(s) != null && !inPriceRange(s));
  if (!targets.length) { toast("Nothing to exclude"); return; }
  for (const s of targets) await jsend(`/api/scans/${s.id}`, "PATCH", { included: false });
  poll(); toast(`Excluded ${targets.length} card${targets.length>1?'s':''}`);
});

$("#refreshBtn").addEventListener("click", () => { listSig=""; detailSig=""; poll(); });

async function clearScans(only){
  const n = only === "unselected"
    ? scans.filter(s => s.status !== "selected").length
    : scans.length;
  if (!n) { toast("Nothing to delete"); return; }
  const what = only === "unselected" ? `${n} unpicked scan${n>1?'s':''}` : `ALL ${n} scans`;
  if (!confirm(`Delete ${what}? This cannot be undone.`)) return;
  const r = await jsend("/api/scans/delete-all", "POST", only ? { only } : {});
  focusedId = null; listSig = ""; detailSig = "";
  await poll(); renderDetail();
  toast(`Deleted ${r.deleted} scan${r.deleted===1?'':'s'}`);
}
$("#clearJunkBtn").addEventListener("click", () => clearScans("unselected"));
$("#clearAllBtn").addEventListener("click", () => clearScans(null));
$("#exportBtn").addEventListener("click", () => { window.location = "/api/export"; });
// Advertise the PHONE-reachable address from the server's detected LAN IP,
// not location.origin — which is "localhost" whenever the operator opens the
// UI on the server machine (e.g. a Chromebook running the scanner locally).
let phoneQrUrl = "/api/phone-qr";
let needManualIp = false;
function showPhoneIp(ip, port){
  $("#phoneLink").textContent = `Phone: https://${ip}:${port}/phone`;
  $("#phoneLink").title = "Click for a QR code to open the scanner on your phone";
}
jget("/api/version").then(d => {
  const port = location.port || "8443";
  const saved = localStorage.getItem("phoneIp");
  if (d.is_lan && d.lan_ip){
    showPhoneIp(d.lan_ip, port);
  } else if (saved){
    // Operator told us the Wi-Fi IP before (Crostini can't detect it).
    needManualIp = true;
    phoneQrUrl = "/api/phone-qr?ip=" + encodeURIComponent(saved);
    showPhoneIp(saved, port);
  } else {
    // Container / localhost-only: the server can't see a phone-reachable IP
    // (classic Crostini). Ask the operator for it on click.
    needManualIp = true;
    $("#phoneLink").textContent = "Phone: click to set up";
    $("#phoneLink").title = "The server can't detect a phone-reachable address "
      + "(common on Chromebooks). Click, then enter this device's Wi-Fi IP "
      + "from Settings → Network → your Wi-Fi.";
  }
}).catch(() => { $("#phoneLink").textContent = "Phone: " + location.origin + "/phone"; });
// Click the phone link -> QR code in the lightbox; point the phone camera at it.
// When the server can't see a phone-reachable IP, ask for it once and remember.
$("#phoneLink").addEventListener("click", () => {
  if (needManualIp){
    const cur = localStorage.getItem("phoneIp") || "";
    const ip = (prompt("This device's Wi-Fi IP (Settings → Network → your "
      + "Wi-Fi → \"IP address\"):", cur) || "").trim();
    if (!ip) return;
    localStorage.setItem("phoneIp", ip);
    phoneQrUrl = "/api/phone-qr?ip=" + encodeURIComponent(ip);
    showPhoneIp(ip, location.port || "8443");
  }
  openLightbox(phoneQrUrl);
});

/* ── downloads panel: card database + printing images ───────────────────── */
let dlOpen = false, dlPoll = null;
async function checkSetup(){
  try {
    const st = await jget("/api/setup/status");
    const needIndex = !st.index_built;
    $("#dlBar").style.display =
      (dlOpen || needIndex || st.building || st.prefetching) ? "flex" : "none";

    // "12,345 / 49,500 (24.9%) · 8.2/s · ~1h 23m left"; stage-aware (the bulk
    // download reports MB, the hash/fetch loops report items).
    const fmtEta = s => s == null ? "estimating time left…"
      : s >= 5400 ? `~${Math.floor(s/3600)}h ${Math.round(s%3600/60)}m left`
      : s >= 90 ? `~${Math.round(s/60)} min left` : `~${Math.max(s,5)} s left`;
    const fmtProg = (p, noun) => {
      if (!p || !p.total) return null;
      const unit = p.unit || noun;
      const stage = p.stage === "download" ? "downloading card data" :
                    p.stage === "hash" ? "hashing artworks" : "downloading images";
      return ` ${stage} — ${p.done.toLocaleString()} / ${p.total.toLocaleString()} ${unit}`
        + ` (${p.pct}%)` + (p.rate_per_s ? ` · ${p.rate_per_s}/s` : "")
        + ` · ${fmtEta(p.eta_s)}`;
    };

    $("#dlIndexInfo").textContent = st.building
      ? (fmtProg(st.build_progress, "artworks")
         || ` building — ${st.indexed.toLocaleString()} / ~${st.total.toLocaleString()} artworks…`)
        + " (keep this window open)"
      : st.index_built ? ` ✓ ${st.indexed.toLocaleString()} artworks`
      : st.indexed > 0 ? ` ${st.indexed.toLocaleString()} done — resumable`
      : " not built — scanning won't work until it is.";
    if (st.error) $("#dlIndexInfo").textContent += ` — failed: ${st.error} (resumes where it left off)`;
    $("#dlIndexBtn").disabled = st.building;
    $("#dlIndexBtn").textContent = st.building ? "Building…"
      : st.index_built ? "Check for new sets" : "Build (~1 hr, one-time)";

    $("#dlImgInfo").textContent = st.prefetching
      ? (fmtProg(st.prefetch_progress, "images")
         || ` downloading — ${st.images.toLocaleString()} / ~${st.images_total.toLocaleString()}…`)
      : ` ${st.images.toLocaleString()} / ~${st.images_total.toLocaleString()} cached`;
    if (st.prefetch_error) $("#dlImgInfo").textContent += ` — failed: ${st.prefetch_error} (resumable)`;
    $("#dlImgBtn").disabled = st.prefetching;
    $("#dlImgBtn").textContent = st.prefetching ? "Downloading…" : "Download all";

    clearTimeout(dlPoll);
    if (st.building || st.prefetching) dlPoll = setTimeout(checkSetup, 5000);
  } catch(e){ /* server starting up */ }
}
$("#dlBtn").addEventListener("click", () => { dlOpen = !dlOpen; checkSetup(); });
$("#dlIndexBtn").addEventListener("click", async () => {
  await jsend("/api/setup/build-index", "POST", {}); checkSetup();
});
$("#dlImgBtn").addEventListener("click", async () => {
  await jsend("/api/setup/prefetch-images", "POST", {}); checkSetup();
});
checkSetup();

/* ── F2F request log (debug) ─────────────────────────────────────────────── */
let f2fLogTimer = null;
async function renderF2fLog(){
  try {
    const d = await jget("/api/price-debug");
    const el = $("#f2fLog");
    const rows = (d.events || []).slice(-45).reverse().map(e => {
      const age = Math.max(0, Math.round(Date.now()/1000 - e.t));
      const col = e.status === "200" ? "var(--good)"
                : e.status === "429" ? "var(--warn)"
                : e.status === "cache" ? "var(--dim)" : "var(--bad)";
      return `<div><span style="color:var(--dim)">${String(age).padStart(3)}s</span> ` +
        `<b style="color:${col}">${esc(e.status)}</b> ` +
        `<span style="color:var(--muted)">pace ${e.delay_s}s${e.wait_s ? ` · waited ${e.wait_s}s` : ""}</span> ` +
        `<span style="color:var(--muted)">${esc(e.url)}</span></div>`;
    }).join("");
    el.innerHTML = `<div style="margin-bottom:6px"><b>F2F requests</b> (newest first) · pace 1/${d.pace_s ?? "—"}s` +
      `<span style="float:right;cursor:pointer" id="f2fLogClose">✕</span></div>` +
      (rows || `<span style="color:var(--muted)">no requests yet this session</span>`);
    $("#f2fLogClose").addEventListener("click", toggleF2fLog);
  } catch(e){}
}
function toggleF2fLog(){
  const el = $("#f2fLog");
  const open = el.style.display === "none";
  el.style.display = open ? "block" : "none";
  clearInterval(f2fLogTimer); f2fLogTimer = null;
  if (open){ renderF2fLog(); f2fLogTimer = setInterval(renderF2fLog, 3000); }
}
$("#f2fLogBtn").addEventListener("click", toggleF2fLog);

/* ── manual sweep start ──────────────────────────────────────────────────── */
$("#sweepStartBtn").addEventListener("click", async () => {
  const r = await jsend("/api/scans/price-missing", "POST", {});
  toast(r.already_running ? "Sweep already running"
    : r.queued ? `Sweep started — ${r.queued} prices to fetch` : "Nothing needs pricing");
  poll();
});

poll();
setInterval(poll, 1500);
</script>
