<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Card Scanner — Camera</title>
<style>
  :root { color-scheme: dark;
    --bg:#0f1115; --panel:#12141a; --card:#171a21; --line:#23262e;
    --text:#e8eaed; --muted:#8b93a1; --accent:#3b82f6; --good:#6ee7a0;
    --warn:#fbbf24; --bad:#ff8a8a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; height:100dvh; overflow:hidden;
         /* viewport-fit=cover (for the panels' insets) — keep the camera chrome clear too */
         padding:env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { padding:8px 12px; font-weight:600; border-bottom:1px solid var(--line);
           display:flex; align-items:center; justify-content:space-between; flex:0 0 auto; }
  #ver { font-size:11px; color:#7b8290; font-weight:400; margin-left:6px; }
  .hbtn { font-size:14px; font-weight:600; padding:6px 12px; border:0; border-radius:8px;
          background:var(--line); color:#cbd2dc; }
  .hbtn.on { background:#1c2740; color:#cfe1ff; }

  /* camera stage — pointer-drag must reach the scan-area setter, not scroll */
  #stage { position:relative; flex:1; background:#000; overflow:hidden; touch-action:none; min-height:0; }
  /* contain, not cover: preview must show EXACTLY the captured frame */
  video { width:100%; height:100%; object-fit:contain; }
  #overlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  footer { padding:8px 12px 12px; display:flex; flex-direction:column; gap:8px; flex:0 0 auto; }
  #status { min-height:1.3em; text-align:center; font-size:14px; color:#aeb4bf; }
  #status.ok { color:var(--good); } #status.err { color:var(--bad); }
  .btnrow { display:flex; gap:10px; }
  .btnrow button { font-size:18px; font-weight:600; padding:14px; border:0; border-radius:12px;
                   background:var(--accent); color:#fff; flex:1; }
  .btnrow button:disabled { background:#2a2f3a; color:#7b8290; }
  #autoBtn { flex:0 0 34%; background:#14532d; color:#86efac; }
  #autoBtn.off { background:var(--line); color:#7b8290; }
  .hint { font-size:11px; color:#7b8290; text-align:center; }

  /* ═══ review panels (scan list + printing picker) — v36 "camera app" skin ═══
     Everything below is scoped to .panel / its children, so the camera page's
     own chrome above is untouched; desktop.html is a separate file. The same
     panels serve the browser /phone page and the Android app's WebView
     (?panel=1), so safe-area insets are honoured (viewport-fit=cover). */
  .panel { position:fixed; inset:0; background:var(--bg); z-index:20; display:none; flex-direction:column;
           padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  .panel.open { display:flex; }
  .panel > header { flex:0 0 auto; min-height:56px; padding:8px 12px 8px 16px; gap:12px;
                    border-bottom:0; font-size:18px; font-weight:700; }
  .panel > header .ptitle { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .panel > header .hbtn { flex:0 0 auto; min-height:40px; padding:0 18px; border-radius:999px;
                          background:#1d2129; color:#dfe3ea; font-size:15px; }
  .pbody { flex:1; overflow-y:auto; min-height:0; overscroll-behavior:contain; }
  .panel button, .panel select, .panel input { font-family:inherit; }
  .panel button { cursor:pointer; -webkit-tap-highlight-color:transparent; }

  /* view tabs — a horizontally scrollable segmented row + the Filters chip */
  #scansTop { padding:2px 12px 8px; flex:0 0 auto; }
  #scansBar { display:flex; gap:2px; padding:4px; border-radius:999px;
              background:var(--card); overflow-x:auto; scrollbar-width:none; }
  #scansBar::-webkit-scrollbar { display:none; }
  .vchip { flex:1 0 auto; display:flex; align-items:center; justify-content:center; min-height:38px; padding:0 13px;
           font-size:14px; font-weight:500; border-radius:999px; color:#aeb4bf; white-space:nowrap;
           cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .vchip.on { background:#2b3342; color:#fff; font-weight:600; }
  #scansMeta { display:flex; align-items:center; gap:10px; padding:0 12px 10px 16px; flex:0 0 auto; }
  #fltBtn { flex:0 0 auto; display:flex; align-items:center; gap:6px; min-height:40px; padding:0 14px;
            border-radius:999px; background:var(--card); border:1px solid var(--line); color:#cbd2dc;
            font-size:14px; font-weight:600; }
  #fltBtn svg { width:16px; height:16px; }
  #fltBtn.active { border-color:#2c4a7a; }
  #fltBtn.on { background:#1c2740; border-color:var(--accent); color:#cfe1ff; }
  #fcount { display:none; min-width:18px; height:18px; padding:0 5px; border-radius:9px;
            background:var(--accent); color:#fff; font-size:11px; font-weight:700;
            align-items:center; justify-content:center; }
  #fltBtn.active #fcount { display:inline-flex; }

  /* collapsible filter + bulk-action sheet */
  #fltPanel { display:none; flex-direction:column; gap:12px; margin:0 12px 10px; padding:14px;
              border-radius:18px; background:var(--card); flex:0 0 auto; }
  #fltPanel.open { display:flex; }
  .fcap { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase;
          letter-spacing:.04em; margin-bottom:-4px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .bar input, .bar select { flex:1 1 0; min-width:64px; min-height:44px; padding:0 12px; border-radius:12px;
                            border:1px solid #2a2f3a; background:var(--bg); color:var(--text); font-size:16px; }
  .bar select { flex:1 1 60%; }
  .bar button, .bar .mchip { flex:1 0 auto; min-height:44px; padding:0 14px; border:0; border-radius:12px;
                             background:#232834; color:#dfe3ea; font-size:14px; font-weight:600;
                             white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; }
  #p-excl, .bar .mchip { flex:0 0 auto; }
  .bar input { padding:0 10px; -moz-appearance:textfield; }
  .bar input::-webkit-inner-spin-button, .bar input::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  .bar .mchip { cursor:pointer; user-select:none; font-weight:500; }
  .bar .mchip b { color:#93c5fd; margin-left:4px; }
  .bar button.danger { background:transparent; border:1.5px solid #6b2b2b; color:#fca5a5; }
  .bar button:disabled { opacity:.6; }
  #fhint { font-size:12px; color:var(--warn); margin:0 12px 10px; padding:8px 12px; line-height:1.35;
           border-radius:12px; background:#2a2010; flex:0 0 auto; }
  #scansStat { flex:1 1 auto; min-width:0; font-size:13px; color:var(--muted); line-height:1.35; }
  #scansStat b { color:var(--text); } #scansStat .money { color:var(--good); font-weight:600; }
  #sweepInfo { font-size:12px; color:var(--muted); margin:0 12px 8px; padding:6px 12px; border-radius:999px;
               background:var(--card); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 0 auto; }

  /* scan rows: thumb | name + one meta line | price over badges. Whole row taps. */
  #scansList { padding-bottom:env(safe-area-inset-bottom); border-top:1px solid var(--line); }
  .srow { display:flex; gap:12px; min-height:64px; padding:10px 16px; align-items:center;
          border-bottom:1px solid #1b1e26; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .srow:active { background:var(--card); }
  /* Swipe-to-delete: the row slides over a red "Delete" layer. pan-y leaves
     vertical scrolling to the browser; horizontal drags come to us. */
  .sitem { position:relative; overflow:hidden; background:#b91c1c; }
  .sitem .sdel { position:absolute; inset:0; display:flex; align-items:center; justify-content:space-between;
                 padding:0 24px; color:#fff; font-weight:700; font-size:15px; }
  .sitem > .srow { position:relative; background:var(--bg); touch-action:pan-y; }
  .sitem > .srow.drag { transition:none; }
  .sitem > .srow.snap { transition:transform .18s ease-out; }
  .sitem.gone { transition:max-height .2s ease-in .12s; max-height:0 !important; }
  #undoBar { position:absolute; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:5;
             display:none; align-items:center; gap:12px; padding:10px 10px 10px 16px; border-radius:14px;
             background:#262a35; color:var(--text); box-shadow:0 6px 24px #0008; font-size:14px; }
  #undoBar.show { display:flex; }
  #undoBar span { flex:1 1 auto; }
  #undoBar button { min-height:40px; padding:0 18px; border-radius:999px; border:0; font-weight:700;
                    background:transparent; color:var(--accent); font-size:15px; }
  /* A passing notice on the list (a pick just closed the card): the undo bar's look, no button. */
  #flash { position:absolute; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:5;
           display:none; padding:12px 16px; border-radius:14px; background:#262a35; color:var(--good);
           box-shadow:0 6px 24px #0008; font-size:14px; font-weight:600; text-align:center; }
  #flash.show { display:block; }
  .srow .sthumb { flex:0 0 48px; width:48px; height:67px; border-radius:5px; overflow:hidden;
                  background:var(--line); }
  .srow .sthumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .srow .meta { flex:1 1 auto; min-width:0; }
  .srow .nm { font-size:16px; font-weight:600; line-height:1.25; overflow:hidden; overflow-wrap:anywhere;
              display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .srow .sub { font-size:13px; color:var(--muted); margin-top:3px; line-height:1.3; overflow:hidden;
               display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .srow .sright { flex:0 0 auto; max-width:44%; display:flex; flex-direction:column;
                  align-items:flex-end; gap:6px; }
  .srow .spills { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .sprice { color:var(--good); font-weight:700; font-size:15px; white-space:nowrap; }
  .sempty { padding:48px 24px; text-align:center; color:#6b7280; }
  .spill { font-size:11px; font-weight:600; padding:3px 8px; border-radius:999px; background:#3f2d10;
           color:var(--warn); white-space:nowrap; }
  .spill.sel { background:#14532d; color:#86efac; }
  .spill.chk { background:#3a1c1c; color:#fca5a5; }
  .spill.flag { background:#4a1d1d; color:#fca5a5; }
  /* Roles (the phone server): a guest reviews, picks and FLAGS; deleting,
     clearing, exporting and the sweep are the paired computer's (admin). */
  body.guest .admin-only { display:none !important; }
  body:not(.guest) .guest-only { display:none !important; }
  /* Popularity tiers (mtg_card_scanner/popularity.py) — only the top three
     get a colour, so "played" never competes with the pending/check pills. */
  .spill.pop { background:var(--line); color:#aeb4bf; }
  .spill.pop.staple { background:#3a2e08; color:#fcd34d; font-weight:700; }
  .spill.pop.strong { background:#2e1065; color:#c4b5fd; }
  .spill.pop.solid  { background:#0c2a4d; color:#93c5fd; }
  /* Format legality — where the card may be PLAYED. Detail panel only: the
     scan list is read at arm's length and has no room for seven more chips. */
  .pfmt { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; align-items:center; }
  .fmt { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--line); color:#aeb4bf; }
  .fmt.banned { background:#3a1c1c; color:#fca5a5; text-decoration:line-through; }
  .fmt.restricted { background:#3f2d10; color:var(--warn); }

  /* detail / printing picker */
  #detailBody { padding:4px 16px 24px; }
  .pname { font-size:19px; font-weight:700; line-height:1.25; overflow-wrap:anywhere; }
  .psub { font-size:13px; color:var(--muted); margin-top:3px; line-height:1.35; }
  .pprice { font-size:22px; font-weight:700; color:var(--good); margin:8px 0 2px; line-height:1.2; }
  .perr { font-size:12px; color:var(--bad); margin-top:6px; }
  .pctl { display:flex; gap:8px; margin:12px 0 4px; }
  .pctl select, .pctl .qty { min-height:46px; border-radius:14px; border:1px solid #2a2f3a;
                             background-color:var(--card); color:var(--text); font-size:16px; }
  .pctl select { flex:1 1 0; min-width:0; padding:0 30px 0 14px; appearance:none; -webkit-appearance:none;
                 background-image:linear-gradient(45deg,transparent 50%,#8b93a1 50%),
                                  linear-gradient(135deg,#8b93a1 50%,transparent 50%);
                 background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%;
                 background-size:5px 5px; background-repeat:no-repeat; }
  .pctl #p-fin { flex-grow:1.35; }
  .pctl .qty { flex:0 0 88px; display:flex; align-items:center; gap:4px; padding:0 12px; }
  .pctl .qty span { font-size:13px; color:var(--muted); }
  .pctl .qty input { flex:1; min-width:0; width:100%; border:0; background:transparent; color:var(--text);
                     font-size:16px; padding:0; outline:none; }
  .subhead { font-size:13px; color:var(--muted); margin:18px 0 10px; font-weight:600; }
  /* Compare the scan photo with a printing (owner, 2026-10-02): side by side, or
     overlaid — "wipe" (a divider to drag) or "blend" (the top layer's opacity),
     with either image as the base layer. The buttons step through the candidates. */
  .cmp { margin-top:8px; border-radius:18px; background:var(--card); padding:12px 12px 12px; }
  /* The compared printing is the card's head (no photo row above it any more). */
  .cmptitle { padding-bottom:10px; margin-bottom:8px; border-bottom:1px solid var(--line); }
  .cmptitle .psub b { color:var(--text); }
  .cmptitle .picked { color:var(--good); font-weight:700; }
  .cmptitle .pprice.pp.none { color:var(--muted); font-weight:400; font-size:14px; }
  .cmptitle .pfmt { margin-top:8px; }
  .cmphead { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
             font-size:13px; color:var(--muted); line-height:1.4; }
  .cmphead b { color:var(--text); }
  .cmp .pd { color:var(--muted); }
  .cmpmodes { display:flex; gap:4px; }
  .cmpmodes button { min-height:32px; padding:0 10px; border-radius:999px; border:1px solid var(--line);
                     background:transparent; color:var(--muted); font-size:12px; font-weight:600; }
  .cmpmodes button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .cmpbody { margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .cmpbody.overlay { grid-template-columns:minmax(0, 320px); justify-content:center; }
  /* Card-shaped: a card's corners are rounded 3.2 mm on 63 × 88 mm. */
  .cmpbox { position:relative; aspect-ratio:5/7; border-radius:5% / 3.6%; overflow:hidden; background:#000; }
  .cmpbox img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }
  /* A scan photo with a known card layout shows just the card, cropped to its own edges like
     the printing: fitScan() / applyScanScale() set its transform (cardCrop × the viewer's
     "Scan size"); it shows only once that is set (no frame of the whole photo). */
  .cmpbox img.cmpscan:not([data-fill]) { visibility:hidden; }
  .cmpscale { margin-top:6px; }
  .cmpscale .pd { font-size:12px; flex:0 0 auto; }
  .cmpscale button { min-height:32px; padding:0 10px; font-size:12px; color:var(--muted); flex:0 0 auto; }
  .cmpbody.overlay .cmpbox img.under { z-index:1; }
  .cmpbody.overlay .cmpbox img.over { z-index:2; }
  .cmpcap { position:absolute; left:6px; bottom:6px; z-index:3; font-size:11px; font-weight:700;
            padding:2px 7px; border-radius:999px; background:#000a; color:#fff; pointer-events:none; }
  .cmpctl { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .cmpctl button { min-height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--line);
                   background:transparent; color:var(--text); font-size:15px; font-weight:700; }
  .cmpctl button.primary { background:var(--accent); border-color:var(--accent); color:#fff; flex:1 1 auto; }
  .cmpctl input[type=range] { flex:1 1 auto; min-width:0; accent-color:var(--accent); }
  .cmpctl .sp { flex:1 1 auto; }
  .pgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:10px; }
  .pcard { border:2px solid transparent; border-radius:14px; background:var(--card); padding:6px;
           cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .pcard:active { background:#1d2129; }
  .pcard.chosen { border-color:#22c55e; background:#12241a; }
  .pcard img { width:100%; border-radius:6px; aspect-ratio:5/7; object-fit:cover;
               background:var(--line); display:block; }
  .pcard .pt { display:flex; justify-content:space-between; gap:4px; font-size:12px; margin:6px 2px 0;
               line-height:1.3; color:#cbd2dc; white-space:nowrap; }
  .pcard .pt > span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .pcard .pt .pd { color:var(--muted); flex:0 0 auto; }
  .pnote { display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:2px; }
  .pcard .pp { font-size:14px; font-weight:700; color:var(--good); margin:2px 2px 2px; }
  .pcard .pp.none { color:var(--muted); font-weight:400; font-size:12px; }
  .pfold { grid-column:1/-1; min-height:46px; display:flex; align-items:center; justify-content:center;
           font-size:14px; color:#aeb4bf; border:1.5px dashed #2f3440; border-radius:14px; cursor:pointer; }
  .msrow { display:flex; align-items:center; gap:6px; min-height:52px; padding:4px 4px 4px 16px;
           border-radius:999px; border:1px solid #2a2f3a; background:var(--card); }
  .msrow:focus-within { border-color:var(--accent); }
  .msrow input { flex:1; min-width:0; border:0; background:transparent; color:var(--text);
                 font-size:16px; padding:0; outline:none; }
  .msrow button { flex:0 0 auto; min-height:44px; padding:0 18px; border:0; border-radius:999px;
                  background:var(--accent); color:#fff; font-size:15px; font-weight:600; }
  .dangerbtn { width:100%; min-height:48px; margin-top:24px; border-radius:14px; background:transparent;
               border:1.5px solid #6b2b2b; color:#fca5a5; font-size:15px; font-weight:600; }
  /* price check: Keep / Discard pinned below the scroller, clear of the nav bar */
  #detailFoot { flex:0 0 auto; padding:10px 16px calc(10px + env(safe-area-inset-bottom));
                background:var(--bg); border-top:1px solid var(--line); }
  #detailFoot:empty { display:none; }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:40;
              display:none; align-items:center; justify-content:center; }
  #lightbox.open { display:flex; }
  #lightbox img { max-width:96vw; max-height:92vh; border-radius:10px; }
</style>
</head>
<body class="guest">
  <header><span>📷 Scanner<span id="ver"></span></span>
    <span style="display:flex;gap:6px">
      <select class="hbtn" id="camSel" style="display:none;max-width:38vw" title="Choose camera"></select>
      <button class="hbtn" id="areaBtn">Area</button>
      <button class="hbtn" id="scansBtn">Scans</button>
    </span>
  </header>

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <footer>
    <div id="status">Starting camera…</div>
    <div class="btnrow">
      <button id="autoBtn">Auto: ON</button>
      <button id="shoot" disabled>Scan Card</button>
      <button id="retryBtn" style="display:none;background:#3f2d10;color:var(--warn);border-color:#6b4e14">Retry</button>
    </div>
    <div class="hint">Auto: scans by itself, pick on desktop. Tap Scan Card to pick here.</div>
  </footer>

  <div class="panel" id="scansPanel">
    <header><span class="ptitle">Scanned cards</span>
      <button class="hbtn" id="scansClose">Close</button>
    </header>
    <div id="scansTop">
      <div id="scansBar" role="tablist">
        <span class="vchip on" data-view="all" role="tab">All</span>
        <span class="vchip" data-view="pending" role="tab">Needs pick</span>
        <span class="vchip" data-view="selected" role="tab">Selected</span>
        <span class="vchip" data-view="problem" role="tab">Problems</span>
      </div>
    </div>
    <div id="scansMeta">
      <div id="scansStat"></div>
      <button id="fltBtn" aria-expanded="false" aria-controls="fltPanel"><svg viewBox="0 0 16 16" fill="none"
        stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg>Filters<span
        id="fcount"></span></button>
    </div>
    <!-- Filters + bulk actions fold away; every control keeps its id/behaviour. -->
    <div id="fltPanel">
      <div class="fcap">Price (F2F)</div>
      <div class="bar">
        <input id="p-min" type="number" min="0" step="0.25" placeholder="Min $" inputmode="decimal">
        <input id="p-max" type="number" min="0" step="0.25" placeholder="Max $" inputmode="decimal">
        <button id="p-excl" class="admin-only">Exclude filtered</button>
      </div>
      <div class="fcap">Popularity</div>
      <div class="bar">
        <select id="p-popmin">
          <option value="">Popularity: any</option>
          <option value="played">Played or better</option>
          <option value="solid">Popular or better</option>
          <option value="strong">Very popular or better</option>
          <option value="staple">Staples only</option>
        </select>
        <span class="mchip" id="p-fmode" role="button">match <b>any</b></span>
      </div>
      <div class="fcap">Bulk actions</div>
      <div class="bar">
        <button id="p-fill" class="admin-only">Price missing</button>
        <button id="clr-flag" class="danger admin-only" style="display:none"></button>
        <button id="clr-junk" class="admin-only">Clear unpicked</button>
        <button id="clr-all" class="danger admin-only">Clear all</button>
        <span class="guest-only" style="font-size:12px;color:var(--muted)">Guest: swipe a scan to flag it for deletion — the scanner's owner confirms.</span>
      </div>
    </div>
    <!-- Outside the fold: the ⚠ hint must stay visible while filters are active. -->
    <div id="fhint" style="display:none"></div>
    <div id="sweepInfo" style="display:none"></div>
    <div class="pbody" id="scansList"></div>
    <div id="undoBar" role="status"><span id="undoMsg"></span><button id="undoBtn">Undo</button></div>
    <div id="flash" role="status"></div>
  </div>

  <div class="panel" id="detailPanel">
    <header><span class="ptitle" id="detailTitle">Card</span>
      <button class="hbtn" id="detailBack">Back</button>
    </header>
    <div class="pbody" id="detailBody"></div>
    <div id="detailFoot"></div>
  </div>

  <div id="lightbox"><img id="lightboxImg" alt=""></div>
  <canvas id="canvas" hidden></canvas>
  <canvas id="motion" hidden></canvas>

<script>
/* ═══ REBUILT FOR SPEED (v9+) ═══
   - Scan-only camera flow: the phone scans and reports; printings are picked
     on the DESKTOP (the on-phone picker was removed by request in v13).
     Single-printing cards auto-file server-side; every scan keeps its own
     row (repeat copies are not merged — scan order; the export sums them).
   - Signature-diffed rendering: the old page rebuilt the whole list DOM on
     every 3s poll (flicker, scroll loss, battery). Every render target now
     computes a cheap signature first and touches the DOM only on change —
     every field a row RENDERS must appear in its signature.
   - Overlay redraws only when the box/ROI actually moved.
   - Detection logic (occupancy trigger, AE-drift-cancelled stability, scan
     area) is carried over UNCHANGED from the tuned v6-v8 code. */
const $ = s => document.querySelector(s);
const video = $('#video'), canvas = $('#canvas'), motion = $('#motion');
const overlay = $('#overlay'), statusEl = $('#status');
const shoot = $('#shoot'), autoBtn = $('#autoBtn'), areaBtn = $('#areaBtn');

const BURST = 3, BURST_GAP_MS = 100;
// 1280px q0.85 uploads are hash-equivalent to full-res but ~3x smaller.
const MAX_UPLOAD_DIM = 1280, JPEG_QUALITY = 0.85;
const CONDITIONS = ['NM','LP','MP','HP','DMG'];
const FINISHES = ['Non-Foil','Foil','Etched'];

/* ── detection constants (tuned on the rig — see git history) ──────────────── */
const MW = 176, SAMPLE_MS = 200;
let MH = 132;                 // tracks the scan-area aspect so pixels stay square
const PIX_DELTA = 25;         // gray levels — per-pixel "really changed" bar
const GRAD_THR = 14;          // gradient magnitude counted as "textured"
// 3% + mean-delta cancellation: camera AE shifts every pixel together, and a
// 1% bar starved the steady counter (see changedFrac).
const STABLE_FRAC = 0.03;
const EMPTY_FRAC = 0.015;     // mask below this → tray is empty
const SWAP_FRAC = 0.06;       // change vs last-scanned frame = new card
const STABLE_FRAMES = 2;      // steady samples (~0.4s) before scanning
// The phone's ONLY trigger question is "is something in the tray and settled?"
// — geometry gates (ratio/density/texture windows) rejected real sleeved
// cards three separate times; the SERVER judges card content.
const OCCUPIED_FRAC = 0.02;
const DEBUG = new URLSearchParams(location.search).has('debug');
// ?panel=1 — scans list / printing picker ONLY, no camera: the Android app
// owns the camera natively and opens this page in a WebView for the review
// UI (&detail=<id> jumps straight to that card's picker). Nothing below the
// camera section runs differently; the detection loop simply never starts.
const PANEL = new URLSearchParams(location.search).has('panel');
const PANEL_DETAIL = Number(new URLSearchParams(location.search).get('detail')) || 0;
// The scan the app opened (&detail=<id>, e.g. a shutter tap with Auto off) is
// priced NOW (jumps the sweep queue server-side) and its prices show as they
// land; Back from it returns to the camera. (1.1.2: Handheld's price check and
// its Keep/Discard bar are gone — the scan is simply filed and shown.)

let autoEnabled = true;
let mode = 'watching';        // watching | scanning | awaitNext
let emptyRef = null, emptyGrad = null;
let prevFrame = null, scannedFrame = null;
let stableCount = 0, bootCount = 0, emptyRefreshTick = 0;

function setStatus(msg, cls = '') { statusEl.textContent = msg; statusEl.className = cls; }
const escHtml = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function jsend(url, method, body) {
  return (await fetch(url, { method, headers: {'Content-Type':'application/json'},
                             body: JSON.stringify(body) })).json();
}

/* ── popularity (see mtg_card_scanner/popularity.py) ────────────────────────
   Read off the SELECTION first: one card name can span two oracle cards with
   very different play rates, so after a re-pick candidates[0] may not be the
   printing actually chosen.  setStatus writes textContent, so popTag is plain
   text; popPill goes through escHtml like every other row field. */
function popOf(scan){
  return scan?.selection?.popularity || (scan?.candidates||[])[0]?.popularity || null;
}
// Only the tiers worth interrupting a hands-free run for. "Played", "Fringe"
// and "Unranked" say nothing useful mid-scan and would just add noise to a
// status line the operator reads at arm's length.
const POP_CALLOUT = { staple: '★ staple', strong: 'very popular', solid: 'popular' };
function popTag(scan){
  const p = popOf(scan);
  const tag = p && POP_CALLOUT[p.tier];
  return tag ? ` (${tag})` : '';
}
function popPill(scan){
  const p = popOf(scan);
  if (!p) return '';
  return `<span class="spill pop ${escHtml(p.tier)}">${escHtml(p.label)}</span>`;
}
// Every popularity field the rows render, so the list signature covers it.
// The format chips live in the detail panel, which re-fetches on open rather
// than diffing, so they deliberately stay out of the list signature.
function popSig(scan){
  const p = popOf(scan);
  return p ? p.tier + ':' + p.label : '';
}
// Which formats a card may be PLAYED in — a different question from how much
// it is played, so these never get a popularity colour. `not_legal` is dropped:
// most cards are not legal in most formats and listing that buries the rest.
const FORMAT_LABELS = { standard:'Standard', pioneer:'Pioneer', modern:'Modern',
  legacy:'Legacy', vintage:'Vintage', pauper:'Pauper', commander:'Commander' };
function formatChipsHtml(scan, pop = popOf(scan)){
  const f = pop?.formats;
  if (!f) return '';
  const chip = k => `<span class="fmt ${escHtml(f[k])}">${escHtml(FORMAT_LABELS[k])}</span>`;
  const keys = Object.keys(FORMAT_LABELS);
  const legal = keys.filter(k => f[k] === 'legal');
  const flagged = keys.filter(k => f[k] === 'banned' || f[k] === 'restricted');
  if (!legal.length && !flagged.length) return '';
  // "plays in" only leads when something is actually legal (see desktop.html).
  const lead = legal.length
    ? `<span style="font-size:12px;color:var(--muted)">plays in</span>` : '';
  return `<div class="pfmt">${lead}${legal.map(chip).join('')}${flagged.map(chip).join('')}</div>`;
}

/* ── version banner — proves which page+server combo is running ────────────── */
const UI_VERSION = 'v50';

// Who is asking: the phone server says "guest" for the 6-digit code (admin =
// the paired computer); the computer's own server always says admin. Guests
// get the list without delete/clear/sweep — a swipe FLAGS the scan instead —
// and the server refuses the admin-only routes anyway.
// Fails CLOSED: guest until /api/me answers (a 404 = a server from before roles = admin).
let role = 'guest';
fetch('/api/me').then(r => r.status === 404 ? { role: 'admin' } : r.ok ? r.json() : null).then(d => {
  if (!d) return;
  role = d.role === 'admin' ? 'admin' : 'guest';
  document.body.classList.toggle('guest', role === 'guest');
  lastListSig = ''; lastStatSig = '';
  if (typeof renderScansPanel === 'function') renderScansPanel();
  if (typeof renderScanDetail === 'function' && detailScanId) renderScanDetail();   // an open card too
}).catch(() => {});
fetch('/api/version').then(r => r.json())
  .then(d => { $('#ver').textContent = `${UI_VERSION} · ${d.version}`; })
  .catch(() => { $('#ver').textContent = UI_VERSION; });

/* ── scan area (ROI) — crops sampling AND capture to the tray ──────────────── */
let roi = null;               // {x0,y0,x1,y1} video-frame fractions, or null
try { roi = JSON.parse(localStorage.getItem('scanROI') || 'null'); } catch (e) { roi = null; }
let settingArea = false, dragA = null, dragB = null;

function roiRect() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!roi) return { x: 0, y: 0, w: vw, h: vh };
  return { x: roi.x0 * vw, y: roi.y0 * vh,
           w: (roi.x1 - roi.x0) * vw, h: (roi.y1 - roi.y0) * vh };
}
function contain() {          // object-fit:contain letterbox mapping
  const cw = overlay.clientWidth, ch = overlay.clientHeight;
  const s = Math.min(cw / video.videoWidth, ch / video.videoHeight);
  return { s, ox: (cw - video.videoWidth * s) / 2, oy: (ch - video.videoHeight * s) / 2 };
}
function resetDetection(msg) {
  emptyRef = null; emptyGrad = null; prevFrame = null;
  bootCount = 0; stableCount = 0; emptyRefreshTick = 0; mode = 'watching';
  lastDrawSig = '';
  if (msg) setStatus(msg);
}
function updateAreaBtn() {
  areaBtn.textContent = settingArea ? 'Cancel' : roi ? 'Area ✓' : 'Area';
  areaBtn.classList.toggle('on', !!roi && !settingArea);
}
areaBtn.addEventListener('click', () => {
  if (settingArea) { settingArea = false; dragA = dragB = null; updateAreaBtn();
                     setStatus('Scan area unchanged.'); return; }
  if (roi) { roi = null; localStorage.removeItem('scanROI'); updateAreaBtn();
             resetDetection('Scan area cleared — full frame. Empty the tray to re-learn…'); return; }
  settingArea = true; updateAreaBtn(); setStatus('Drag a box around the tray…');
});
const stageEl = $('#stage');
const stagePt = e => { const b = stageEl.getBoundingClientRect();
                       return { x: e.clientX - b.left, y: e.clientY - b.top }; };
stageEl.addEventListener('pointerdown', e => {
  if (!settingArea) return;
  dragA = dragB = stagePt(e); stageEl.setPointerCapture(e.pointerId); e.preventDefault();
});
stageEl.addEventListener('pointermove', e => {
  if (!settingArea || !dragA) return;
  dragB = stagePt(e); lastDrawSig = ''; drawOverlay(null);
});
stageEl.addEventListener('pointerup', e => {
  if (!settingArea || !dragA) return;
  dragB = stagePt(e);
  const { s, ox, oy } = contain();
  const frac = p => ({
    x: Math.min(1, Math.max(0, (p.x - ox) / s / video.videoWidth)),
    y: Math.min(1, Math.max(0, (p.y - oy) / s / video.videoHeight)),
  });
  const a = frac(dragA), b = frac(dragB);
  const cand = { x0: Math.min(a.x,b.x), y0: Math.min(a.y,b.y),
                 x1: Math.max(a.x,b.x), y1: Math.max(a.y,b.y) };
  settingArea = false; dragA = dragB = null;
  if (cand.x1 - cand.x0 < 0.08 || cand.y1 - cand.y0 < 0.08) {
    updateAreaBtn(); setStatus('Area too small — tap Area and drag again.', 'err'); return;
  }
  roi = cand; localStorage.setItem('scanROI', JSON.stringify(roi));
  updateAreaBtn(); resetDetection('Scan area set ✓ Empty the tray to re-learn it…');
});
updateAreaBtn();

/* ── camera + wake lock ────────────────────────────────────────────────────── */
// Camera choice: phones default to the rear camera, but this page also runs on
// a laptop with a USB webcam over the tray (the no-port-forward Chromebook
// setup) — there facingMode would grab the built-in selfie cam. The dropdown
// lists every attached camera by name; the choice sticks (localStorage).
let camDevices = [];
async function startCamera(deviceId = localStorage.getItem('camId') || '') {
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus('Camera needs HTTPS. Open this page over https://.', 'err'); return;
  }
  try {
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    const base = { width: { ideal: 1920 }, height: { ideal: 1080 } };
    const stream = await navigator.mediaDevices.getUserMedia({
      video: deviceId ? { ...base, deviceId: { exact: deviceId } }
                      : { ...base, facingMode: { ideal: 'environment' } },
      audio: false,
    }).catch(e => {
      // A remembered webcam may be unplugged today — fall back to default.
      if (deviceId) return navigator.mediaDevices.getUserMedia(
        { video: { ...base, facingMode: { ideal: 'environment' } }, audio: false });
      throw e;
    });
    video.srcObject = stream;
    await video.play();
    // References learned on the old camera are wrong geometry for the new one.
    emptyRef = null; emptyGrad = null; prevFrame = null; bootCount = 0;
    shoot.disabled = false;
    camDevices = (await navigator.mediaDevices.enumerateDevices())
      .filter(d => d.kind === 'videoinput');
    const sel = $('#camSel');
    sel.style.display = camDevices.length > 1 ? '' : 'none';
    const curId = stream.getVideoTracks()[0]?.getSettings().deviceId;
    sel.innerHTML = camDevices.map((d, i) => {
      const label = (d.label || `Camera ${i + 1}`).split('(')[0].trim();
      return `<option value="${d.deviceId}"${d.deviceId === curId ? ' selected' : ''}>${escHtml(label)}</option>`;
    }).join('');
    setStatus('Auto: waiting for a steady view…');
  } catch (e) {
    setStatus('Camera blocked: ' + e.message + ' (HTTPS required on phones).', 'err');
  }
}
$('#camSel').addEventListener('change', () => {
  localStorage.setItem('camId', $('#camSel').value);
  startCamera($('#camSel').value);
});
let wakeLock = null;
async function acquireWakeLock() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) { /* unsupported */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') acquireWakeLock();
});
if (!PANEL) acquireWakeLock();

/* ── capture + submit (state machine releases after the burst) ─────────────── */
// toBlob copies the canvas bitmap AT CALL TIME (HTML spec; Chromium snapshots
// in CanvasAsyncBlobCreator) and only the JPEG encode is deferred — so the
// burst no longer waits for each encode before the next frame. Awaiting every
// encode stretched the hold-still window from 2×100 ms to 2×100 ms + three
// encodes on a Snapdragon 480; now the tray is released once the PIXELS are in
// hand and the encodes finish behind the operator's hand.
function grabFrame() {
  const r = roiRect();
  const scale = Math.min(1, MAX_UPLOAD_DIM / Math.max(r.w, r.h));
  const w = Math.round(r.w * scale), h = Math.round(r.h * scale);
  // Setting width/height clears and reallocates even when unchanged.
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  canvas.getContext('2d').drawImage(video, r.x, r.y, r.w, r.h, 0, 0, w, h);
  return new Promise((res, rej) => canvas.toBlob(
    b => b ? res(b) : rej(new Error('JPEG encode failed')), 'image/jpeg', JPEG_QUALITY));
}
// Resolves as soon as the last frame's pixels are captured; `encoded` settles
// when the JPEGs are ready (wrapped so awaiting the burst never waits on them).
async function captureBurst() {
  const shots = [];
  for (let i = 0; i < BURST; i++) {
    if (i > 0) await new Promise(r => setTimeout(r, BURST_GAP_MS));
    shots.push(grabFrame());
  }
  shots.forEach(p => p.catch(() => {}));   // failures surface via `encoded`
  return { encoded: Promise.all(shots) };
}
// scanOnce resolves at end-of-capture; identification continues in background.
async function scanOnce(manual = false) {
  setStatus('Capturing…');
  let shot;
  try { shot = await captureBurst(); }
  catch (e) { setStatus('Capture failed: ' + e.message, 'err'); return; }
  submitScan(shot.encoded, manual);    // deliberately NOT awaited
}
// No-match retry: the card is still in the tray (the trigger waits for a tray
// CHANGE, so a failed card would otherwise just sit there unscannable). Offer
// a fresh capture; a successful retry REPLACES the failed row server-side.
const retryBtn = $('#retryBtn');
let retryReplaceId = 0;
function offerRetry(failedId) {
  retryReplaceId = failedId || 0;
  retryBtn.style.display = '';
}
function hideRetry() { retryBtn.style.display = 'none'; }
retryBtn.addEventListener('click', async () => {
  hideRetry();
  setStatus('Retrying — capturing…');
  let shot;
  try { shot = await captureBurst(); }
  catch (e) { setStatus('Capture failed: ' + e.message, 'err'); return; }
  submitScan(shot.encoded, false, retryReplaceId);
});

async function submitScan(framesP, manual = false, replaceId = 0) {
  const capturedScene = scannedFrame;      // FIRST, before any await (no_card guard)
  hideRetry();
  setStatus('Scanning…');
  try {
    const frames = await framesP;          // encodes finish while the tray is released
    const fd = new FormData();
    frames.forEach((b, i) => fd.append('files', b, `frame${i}.jpg`));
    if (replaceId) fd.append('replace_scan_id', String(replaceId));
    const r = await fetch('/api/scan', { method: 'POST', body: fd });
    const data = await r.json();
    if (data.no_card) {
      // Adopt the scene as "empty" ONLY if the tray still shows what we
      // scanned — the user may already have swapped in the next card.
      setStatus('No card detected.', 'err');
      const s = sampleSmallGray();
      if (s && capturedScene && s.length === capturedScene.length
          && changedFrac(s, capturedScene) < SWAP_FRAC) {
        emptyRef = s; emptyGrad = gradMap(s);
      }
      // The failed row (if this was a retry) is still there — keep offering.
      if (replaceId) offerRetry(replaceId);
    } else if (data.identified) {
      setStatus((data.selection?.auto_picked
        ? `✓ ${data.card_read.name}${popTag(data)} — exact printing confident, auto-filed ⚠`
        : `✓ ${data.card_read.name}${popTag(data)}${manual ? ' — pick a printing.' : ' — filed for desktop pick. Next card…'}`), 'ok');
      // Manual mode: open the printing picker right here so the operator can
      // choose on the phone. Auto mode stays hands-free (desktop picks).
      if (manual && !data.selection?.auto_picked) openDetail(data.id);
    } else if ((data.candidates || []).length) {
      setStatus(`? Best guess ${data.card_read?.name || '?'}${popTag(data)}${manual ? ' — verify & pick.' : ' — verify on desktop.'}`, 'err');
      if (manual) openDetail(data.id);
    } else {
      setStatus('✗ ' + (data.error || 'No match.') + ' — Retry with a fresh capture?', 'err');
      offerRetry(data.id);
    }
    refreshScans();
  } catch (e) {
    setStatus('Upload failed: ' + e.message, 'err');
  }
}

/* ── frame sampling + occupancy detection (tuned — do not "improve") ───────── */
function sampleSmallGray() {
  if (!video.videoWidth) return null;
  const r = roiRect();
  const wantMH = Math.max(48, Math.round(MW * r.h / r.w));
  if (wantMH !== MH) {   // aspect (re)learned — old references are wrong geometry
    MH = wantMH;
    emptyRef = null; emptyGrad = null; prevFrame = null; bootCount = 0;
  }
  motion.width = MW; motion.height = MH;
  const ctx = motion.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, r.x, r.y, r.w, r.h, 0, 0, MW, MH);
  const { data } = ctx.getImageData(0, 0, MW, MH);
  const gray = new Uint8ClampedArray(MW * MH);
  for (let i = 0, j = 0; j < gray.length; i += 4, j++) {
    gray[j] = (data[i] + 2 * data[i + 1] + data[i + 2]) >> 2;
  }
  return gray;
}
function changedFrac(a, b) {
  // Mean-delta subtraction cancels camera auto-exposure hunting (shifts every
  // pixel together); real motion changes pixels in different directions.
  let sum = 0;
  for (let i = 0; i < a.length; i++) sum += a[i] - b[i];
  const mean = sum / a.length;
  let n = 0;
  for (let i = 0; i < a.length; i++) {
    if (Math.abs(a[i] - b[i] - mean) > PIX_DELTA) n++;
  }
  return n / a.length;
}
function gradMap(gray) {
  const g = new Uint8ClampedArray(MW * MH);
  for (let y = 1; y < MH - 1; y++) {
    for (let x = 1; x < MW - 1; x++) {
      const i = y * MW + x;
      g[i] = Math.min(255,
        Math.abs(gray[i + 1] - gray[i - 1]) + Math.abs(gray[i + MW] - gray[i - MW]));
    }
  }
  return g;
}
function cardMask(cur, curGrad) {
  // textured now + smooth when empty → printed detail; OR hugely different
  // from empty → solid regions. 3x3 close bridges the card's signal islands.
  const mask = new Uint8Array(MW * MH);
  for (let i = 0; i < mask.length; i++) {
    if ((curGrad[i] > GRAD_THR && emptyGrad[i] <= GRAD_THR) ||
        Math.abs(cur[i] - emptyRef[i]) > PIX_DELTA * 2) mask[i] = 1;
  }
  const dil = new Uint8Array(MW * MH);
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      let on = 0;
      for (let dy = -1; dy <= 1 && !on; dy++) {
        for (let dx = -1; dx <= 1 && !on; dx++) {
          const yy = y + dy, xx = x + dx;
          if (yy >= 0 && yy < MH && xx >= 0 && xx < MW && mask[yy * MW + xx]) on = 1;
        }
      }
      dil[y * MW + x] = on;
    }
  }
  return dil;
}
function mainBand(counts, thr) {
  let best = null, a = -1;
  for (let i = 0; i <= counts.length; i++) {
    const on = i < counts.length && counts[i] >= thr;
    if (on && a < 0) a = i;
    if (!on && a >= 0) {
      if (!best || (i - a) > (best.b - best.a + 1)) best = { a, b: i - 1 };
      a = -1;
    }
  }
  return best;
}
function expandBand(counts, band, lowThr) {
  let { a, b } = band;
  while (a > 0 && counts[a - 1] >= lowThr) a--;
  while (b < counts.length - 1 && counts[b + 1] >= lowThr) b++;
  return { a, b };
}
function detectBox(cur) {
  const curGrad = gradMap(cur);
  const mask = cardMask(cur, curGrad);
  const rows = new Uint16Array(MH), cols = new Uint16Array(MW);
  let n = 0;
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      if (mask[y * MW + x]) { rows[y]++; cols[x]++; n++; }
    }
  }
  if (!n) return null;
  const maskFrac = n / (MW * MH);
  const rMax = Math.max(...rows), cMax = Math.max(...cols);
  let rband = mainBand(rows, Math.max(2, rMax * 0.30));
  let cband = mainBand(cols, Math.max(2, cMax * 0.30));
  if (!rband || !cband) return null;
  rband = expandBand(rows, rband, Math.max(2, rMax * 0.04));
  cband = expandBand(cols, cband, Math.max(2, cMax * 0.04));
  const w = cband.b - cband.a + 1, h = rband.b - rband.a + 1;
  return { x: cband.a, y: rband.a, w, h, maskFrac };
}

/* ── overlay (draws only when something changed) ───────────────────────────── */
let lastDrawSig = '';
function drawOverlay(box, color, captured = false) {
  const sig = [box && `${box.x},${box.y},${box.w},${box.h}`, color, captured,
               settingArea && dragB && `${dragB.x},${dragB.y}`,
               roi && `${roi.x0},${roi.y0}`].join('|');
  if (sig === lastDrawSig) return;
  lastDrawSig = sig;

  const cw = overlay.clientWidth, ch = overlay.clientHeight;
  if (overlay.width !== cw) overlay.width = cw;
  if (overlay.height !== ch) overlay.height = ch;
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, cw, ch);
  if (!video.videoWidth) return;
  const { s, ox, oy } = contain();

  if (settingArea && dragA && dragB) {
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
    ctx.strokeRect(Math.min(dragA.x, dragB.x), Math.min(dragA.y, dragB.y),
                   Math.abs(dragB.x - dragA.x), Math.abs(dragB.y - dragA.y));
    ctx.setLineDash([]);
  } else if (roi) {
    const r = roiRect();
    ctx.strokeStyle = 'rgba(139,147,161,.85)'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]);
    ctx.strokeRect(ox + r.x * s, oy + r.y * s, r.w * s, r.h * s);
    ctx.setLineDash([]);
  }

  if (!box) return;
  const r = roiRect();
  const fx = r.w / MW * s, fy = r.h / MH * s;
  const bx = ox + r.x * s + box.x * fx, by = oy + r.y * s + box.y * fy;
  const bw = box.w * fx, bh = box.h * fy;
  ctx.beginPath();
  ctx.roundRect(bx, by, bw, bh, 12);
  if (captured) {
    ctx.fillStyle = 'rgba(59,130,246,.62)'; ctx.fill();
    ctx.strokeStyle = '#93c5fd'; ctx.lineWidth = 4; ctx.stroke();
    const cx = bx + bw / 2, cy = by + bh / 2, rr = Math.min(bw, bh) * 0.3;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(6, rr * 0.22);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - rr * 0.75, cy);
    ctx.lineTo(cx - rr * 0.15, cy + rr * 0.6);
    ctx.lineTo(cx + rr * 0.8, cy - rr * 0.6);
    ctx.stroke();
  } else {
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
  }
}
function dbg(msg) { if (DEBUG) setStatus(msg); }

// ── live debug peek ──────────────────────────────────────────────────────────
// In ?debug mode, push the FULL camera frame (not the ROI crop) every 2s to
// /api/debug/frame so what the camera sees can be inspected remotely.
// Separate canvas: sharing the capture canvas could corrupt a scan burst
// that fires mid-tick.
if (DEBUG) {
  const peekCanvas = document.createElement('canvas');
  setInterval(async () => {
    if (!video.videoWidth) return;
    const scale = Math.min(1, MAX_UPLOAD_DIM / Math.max(video.videoWidth, video.videoHeight));
    const w = Math.round(video.videoWidth * scale), h = Math.round(video.videoHeight * scale);
    peekCanvas.width = w; peekCanvas.height = h;
    peekCanvas.getContext('2d').drawImage(video, 0, 0, w, h);
    const blob = await new Promise(r => peekCanvas.toBlob(r, 'image/jpeg', 0.8));
    if (!blob) return;
    const fd = new FormData();
    fd.append('file', blob, 'debug.jpg');
    fetch('/api/debug/frame', { method: 'POST', body: fd }).catch(() => {});
  }, 2000);
}

/* ── auto-scan state machine ───────────────────────────────────────────────── */
function tick() {
  if (!autoEnabled || mode === 'scanning' || settingArea) return;
  const cur = sampleSmallGray();
  if (!cur) return;

  if (!emptyRef) {
    if (prevFrame && changedFrac(cur, prevFrame) < STABLE_FRAC) bootCount++;
    else bootCount = 0;
    if (bootCount >= STABLE_FRAMES + 1) {
      emptyRef = cur; emptyGrad = gradMap(cur); bootCount = 0;
      setStatus('Auto: watching for a card…');
    }
    prevFrame = cur; return;
  }

  const box = detectBox(cur);
  const occupied = !!box && box.maskFrac > OCCUPIED_FRAC;

  if (mode === 'watching') {
    drawOverlay(box, occupied ? '#6ee7a0' : '#fbbf24');
    // prevFrame can be null for one tick after a reset that raced an
    // in-flight no_card response re-seeding emptyRef — guard like the twins.
    if (occupied && prevFrame && changedFrac(cur, prevFrame) < STABLE_FRAC) {
      stableCount++;
      dbg(`occupied ${(box.maskFrac*100).toFixed(1)}% steady ${stableCount}/${STABLE_FRAMES}`);
      if (!DEBUG) setStatus('Card detected — hold still…');
      if (stableCount >= STABLE_FRAMES) {
        stableCount = 0;
        scannedFrame = cur;
        mode = 'scanning';
        lastDrawSig = '';
        drawOverlay(box, null, true);        // solid blue + check = captured
        scanOnce().finally(() => { mode = 'awaitNext'; });
      }
    } else {
      stableCount = 0;
      if (occupied) dbg(`occupied ${(box.maskFrac*100).toFixed(1)}% — settling`);
      else dbg(box ? `watching — mask ${(box.maskFrac*100).toFixed(1)}%` : 'watching — tray empty');
      if ((!box || box.maskFrac < EMPTY_FRAC) && prevFrame
          && changedFrac(cur, prevFrame) < STABLE_FRAC) {
        if (++emptyRefreshTick >= 25) { emptyRef = cur; emptyGrad = gradMap(cur); emptyRefreshTick = 0; }
      } else emptyRefreshTick = 0;
    }
  } else if (mode === 'awaitNext') {
    drawOverlay(box, '#8b93a1');
    const removed = !box || box.maskFrac < EMPTY_FRAC;
    // prevFrame guarded like the watching branch: after a reset raced a
    // no_card re-seed it is null, and changedFrac(cur, null) threw every tick.
    const swapped = scannedFrame && occupied
                 && changedFrac(cur, scannedFrame) > SWAP_FRAC
                 && prevFrame && changedFrac(cur, prevFrame) < STABLE_FRAC;
    if (removed || swapped) {
      mode = 'watching'; stableCount = 0;
      hideRetry();   // the failed card left the tray — a retry now would
                     // capture (and replace the old row with) the WRONG card
      setStatus(removed ? 'Auto: watching for a card…' : 'New card…');
    } else {
      dbg('awaiting next card (remove or swap)');
    }
  }
  prevFrame = cur;
}
if (!PANEL) setInterval(tick, SAMPLE_MS);

/* ── scans data + signature-diffed rendering ───────────────────────────────── */
const scansPanel = $('#scansPanel'), scansList = $('#scansList'), scansBtn = $('#scansBtn');
let scans = [], scansView = 'all', priceMin = null, priceMax = null;
// Swipe-to-delete state (declared here: refreshScans may run before its block).
const pendingDel = new Set();
let swipeDragging = false;
// Popularity floor + how the two bars combine (see desktop.html for why "any"
// is the default: the price floor is what keeps an expensive UNRANKED card
// visible when a popularity floor would otherwise drop it).
let popMin = null, filterMode = 'any';
let lastListSig = '', lastStatSig = '';
let scansTimer = null;

function f2fBest(scan) {
  const c = scan.f2f?.conditions || {};
  const cond = scan.selection?.condition || 'NM';
  const order = { NM:['NM','PL'], LP:['PL','NM'], MP:['MP','PL','NM'],
                  HP:['HP','PL','NM'], DMG:['DMG','HP','PL','NM'] }[cond] || ['NM'];
  for (const k of order) if (c[k] != null) return c[k];
  const vals = Object.values(c); return vals.length ? Math.min(...vals) : null;
}
// Per-print F2F data on an unpicked scan (filled by the sweeper): searched is
// true once EVERY candidate print has a completed search — only then may the
// price filter hide the card, because only then is "no print it could be is
// in range" actually known.
function printInfo(s) {
  // A different artwork (server-set other_art — artwork.py) is never the card:
  // unpriced by the sweep, outside the range, not needed for "searched".
  const cands = (s.candidates || []).filter(c => !c.other_art);
  const searched = cands.length > 0 && cands.every(c => c.f2f_conditions != null);
  const vals = [];
  for (const c of cands) {
    const v = Object.values(c.f2f_conditions || {});
    if (v.length) vals.push(Math.min(...v));
  }
  return { searched, vals };
}
function priceRange(s) {
  const fmt = (lo, hi) => lo === hi ? `$${lo.toFixed(2)}` : `$${lo.toFixed(2)}–$${hi.toFixed(2)}`;
  if (s.status !== 'selected') {
    const { vals } = printInfo(s);
    if (vals.length) return fmt(Math.min(...vals), Math.max(...vals));
  }
  const vals = Object.values(s.f2f?.conditions || {}).map(Number);
  if (!vals.length) return null;
  return fmt(Math.min(...vals), Math.max(...vals));
}
const isProblem = s => !!s.error || !(s.candidates || []).length;
function priceOf(s) { const p = f2fBest(s); return p == null ? null : Number(p); }
const inBand = p => (priceMin == null || p >= priceMin) && (priceMax == null || p <= priceMax);
/* Tri-state vote: true = in band, false = out of band, null = NOT KNOWN YET
   (unpriced, or an unpicked scan whose prints are not all searched). Folding
   that third case into `true` is what made "match all" barely differ from
   "match any" — see desktop.html. */
function priceVote(s) {
  if (priceMin == null && priceMax == null) return null;   // bar is off
  if (s.status === 'selected') {
    const p = priceOf(s);
    return p == null ? null : inBand(p);
  }
  const { searched, vals } = printInfo(s);
  if (!searched || !vals.length) return null;
  return vals.some(inBand);
}
// Old two-valued reading, where an unknown price counts as "do not hide".
function inPriceRange(s) {
  if (isProblem(s)) return true;
  return priceVote(s) !== false;
}

/* Popularity floor. Tier order matches popularity.py; `unranked` sits at the
   bottom because that is what basic lands and Commander-banned cards report —
   but "no EDHREC rank" is NOT "unpopular", so a popularity floor alone would
   drop Black Lotus with the bulk. "match any" is the guard: the price floor
   rescues the valuable ones. */
const POP_ORDER = ['staple', 'strong', 'solid', 'played', 'fringe', 'unranked'];
// Tri-state. null = the scan carries no popularity at all (scanned before the
// feature existed) — NOT 'unranked', which is a real answer.
function popVote(s) {
  if (popMin == null) return null;            // bar is off
  const tier = popOf(s)?.tier;
  if (!tier) return null;                     // not known
  const rank = POP_ORDER.indexOf(tier);
  return rank !== -1 && rank <= POP_ORDER.indexOf(popMin);
}
function meetsPopularity(s) { return popVote(s) !== false; }
function activeFilters() {
  return { price: priceMin != null || priceMax != null, pop: popMin != null };
}
/* ANY: show on any PASS; with no pass but something unknown, show anyway —
   we cannot rule the card out. Hide only when every active bar FAILS.
   ALL: every active bar must be affirmatively satisfied, so an unknown does
   not count and unpriced rows are hidden. See desktop.html for the rationale. */
function passesFilters(s) {
  if (isProblem(s)) return true;
  const on = activeFilters();
  if (!on.price && !on.pop) return true;
  const votes = [];
  if (on.price) votes.push(priceVote(s));
  if (on.pop) votes.push(popVote(s));
  if (filterMode === 'all') return votes.every(v => v === true);
  return votes.some(v => v === true) || votes.some(v => v === null);
}
function renderFilterHint() {
  const el = $('#fhint');
  const on = activeFilters();
  let msg = '';
  if ((on.price || on.pop) && filterMode === 'all')
    msg = '⚠ “match all” hides cards not yet priced, or with no popularity data. '
        + 'Switch to “any” to keep them.';
  else if (on.pop && priceMin == null)
    msg = '⚠ Unranked cards (basics, Commander-banned) are hidden — set a Min $ '
        + 'so valuable ones still show.';
  el.style.display = msg ? 'block' : 'none';
  el.textContent = msg;
  renderFilterChip();
}
// The Filters chip folds the bars away, so it must say when one is ACTIVE:
// a count of active bars (price band, popularity floor). Display only — the
// tri-state logic above is the single source of truth for what is shown.
function renderFilterChip() {
  const on = activeFilters();
  const n = (on.price ? 1 : 0) + (on.pop ? 1 : 0);
  $('#fltBtn').classList.toggle('active', n > 0);
  $('#fcount').textContent = n ? String(n) : '';
}
$('#fltBtn').addEventListener('click', () => {
  const open = $('#fltPanel').classList.toggle('open');
  $('#fltBtn').classList.toggle('on', open);
  $('#fltBtn').setAttribute('aria-expanded', String(open));
});


function renderScansPanel() {
  if (!scansPanel.classList.contains('open')) return;
  // Rows swiped away but still inside their Undo window are already gone here.
  const scans = liveScans();
  const sel = scans.filter(s => s.status === 'selected');
  const total = sel.filter(s => s.included)
    .reduce((t, s) => t + (f2fBest(s) ?? 0) * (s.selection?.quantity || 1), 0);
  const statSig = `${scans.length}~${sel.length}~${total}`;
  if (statSig !== lastStatSig) {
    lastStatSig = statSig;
    $('#scansStat').innerHTML =
      `<b>${scans.length}</b> scans · <b>${scans.length - sel.length}</b> to pick · ` +
      `<span class="money">$${total.toFixed(2)}</span> to export`;
  }
  const nf = scans.filter(s => s.flagged).length;
  $('#clr-flag').style.display = nf ? '' : 'none';
  $('#clr-flag').textContent = `Delete flagged (${nf})`;

  const rows = scans.filter(s => passesFilters(s) && (
    scansView === 'all' ? true :
    scansView === 'pending' ? s.status !== 'selected' :

    isProblem(s)));
  // Sig must cover every rendered field: selection identity (re-picks swap
  // name/set/number/thumb), condition/finish edits, qty, flags, prices,
  // popularity.
  const listSig = scansView + '~' + priceMin + '~' + priceMax +
    '~' + popMin + '~' + filterMode + '~' +
    rows.map(s => [s.id, s.status, s.included,
                   s.selection?.scryfall_id, s.selection?.condition,
                   s.selection?.finish, s.selection?.quantity,
                   s.selection?.auto_picked ? 'a' : '',
                   s.card_read?.name, s.error ? 'e' : '',
                   (s.candidates||[]).length, (s.candidates||[])[0]?.id,
                   JSON.stringify(s.f2f?.conditions||0),
                   printInfo(s).vals.join(';'), popSig(s), s.flagged ? 'f' : '', role].join(',')).join('|');
  if (listSig === lastListSig || swipeDragging) return;

  scansList.innerHTML = rows.map(s => {   // already newest-first from the server
    const isSel = s.status === 'selected';
    const name = s.selection?.name || s.card_read?.name || '(unidentified)';
    const thumb = s.selection?.image_normal || s.candidates?.[0]?.image_small
                  || `/api/scans/${s.id}/image`;
    const pr = priceRange(s);
    const sub = isSel
      ? `${(s.selection.set||'').toUpperCase()} #${s.selection.collector_number} · ${s.selection.condition} · ${s.selection.finish} · ×${s.selection.quantity}`
      : `${(s.candidates||[]).length} printings — tap to pick`;
    const pill = (isSel
      ? `<span class="spill sel">${s.selection?.auto_picked ? '⚠ auto' : 'selected'}</span>`
      : isProblem(s) ? `<span class="spill chk">check</span>`
      : `<span class="spill">pending</span>`) + popPill(s) +
      (s.flagged ? `<span class="spill flag" title="flagged for deletion">🚩</span>` : '');
    const swipeWord = role === 'guest' ? (s.flagged ? 'Unflag' : '🚩 Flag') : 'Delete';
    return `<div class="sitem"><div class="sdel" aria-hidden="true"><span>${swipeWord}</span><span>${swipeWord}</span></div><div class="srow" data-sid="${s.id}" role="button">
      <span class="sthumb"><img src="${escHtml(thumb)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></span>
      <div class="meta">

      <div class="sright">
        ${pr ? `<div class="sprice">${escHtml(pr)}</div>` : ''}

// ── Swipe left/right to delete ──
// The DELETE is held back for UNDO_MS so a mis-swipe costs nothing; the row
// leaves the list at once. Undo restores every scan still waiting.
const UNDO_MS = 5000;
let undoTimer = null, swipeEatClick = false;
function liveScans() { return pendingDel.size ? scans.filter(s => !pendingDel.has(s.id)) : scans; }
// Inside the app the WebView is destroyed when its screen closes — no pagehide,
// no timers — so a delete still inside its Undo window was lost (owner: "slide
// to delete doesn't really delete"). The app is told what's pending and deletes
// it itself when the screen goes away (PanelActivity.onPause).
function tellAppPending() {
  try { window.CardScannerApp?.pendingDeletes?.(JSON.stringify([...pendingDel])); } catch (e) {}
}
function commitDeletes(keepalive) {
  clearTimeout(undoTimer); undoTimer = null;
  const ids = [...pendingDel];
  $('#undoBar').classList.remove('show');
  if (!ids.length) return;
  Promise.all(ids.map(id => fetch(`/api/scans/${id}`, { method: 'DELETE', keepalive })
      .catch(() => {})))
    .finally(() => { ids.forEach(id => pendingDel.delete(id)); tellAppPending(); if (!keepalive) refreshScans(); });
}
function queueDelete(id) {
  pendingDel.add(id);
  tellAppPending();
  scansBtn.textContent = `Scans (${liveScans().length})`;
  $('#undoMsg').textContent = pendingDel.size > 1 ? `${pendingDel.size} scans deleted` : 'Scan deleted';
  $('#undoBar').classList.add('show');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => commitDeletes(false), UNDO_MS);
}
$('#undoBtn').addEventListener('click', () => {
  clearTimeout(undoTimer); undoTimer = null;
  pendingDel.clear();
  tellAppPending();
  $('#undoBar').classList.remove('show');
  scansBtn.textContent = `Scans (${liveScans().length})`;
  lastListSig = ''; lastStatSig = ''; renderScansPanel();
});
// Leaving the page (WebView closed, tab hidden for good) keeps the delete.
addEventListener('pagehide', () => commitDeletes(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) commitDeletes(true); });

function attachSwipe(row) {
  let x0 = 0, y0 = 0, t0 = 0, dx = 0, mode = null, pid = null;
  const item = row.parentElement;
  row.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    x0 = e.clientX; y0 = e.clientY; t0 = e.timeStamp; dx = 0; mode = null; pid = e.pointerId;
    row.classList.remove('snap');
  });
  row.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!mode) {
      if (Math.abs(mx) < 10 && Math.abs(my) < 10) return;
      mode = Math.abs(mx) > Math.abs(my) * 1.5 ? 'x' : 'y';
      if (mode === 'x') { row.setPointerCapture(pid); row.classList.add('drag'); swipeDragging = true; }
    }
    if (mode !== 'x') return;
    dx = mx;
    row.style.transform = `translateX(${dx}px)`;
  });
  const end = e => {
    if (e.pointerId !== pid) return;
    pid = null;
    if (mode !== 'x') return;
    swipeDragging = false;
    row.classList.remove('drag'); row.classList.add('snap');
    // A horizontal drag is never also a tap on the row.
    swipeEatClick = true; setTimeout(() => { swipeEatClick = false; }, 350);
    const w = row.offsetWidth || 1;
    const fast = Math.abs(dx) > 40 && Math.abs(dx) / Math.max(1, e.timeStamp - t0) > 0.6;
    if (e.type === 'pointerup' && (Math.abs(dx) > w * 0.35 || fast) && role === 'guest') {
      // A guest can't delete: the swipe flags (or unflags) it for the owner.
      row.style.transform = '';
      const id = Number(row.dataset.sid);
      const on = !scans.find(s => s.id === id)?.flagged;
      jsend(`/api/scans/${id}`, 'PATCH', { flagged: on })
        .then(() => { setStatus(on ? 'Flagged for deletion — the scanner\'s owner confirms.' : 'Unflagged.', 'ok'); refreshScans(); })
        .catch(() => setStatus('Could not flag that scan.'));
    } else if (e.type === 'pointerup' && (Math.abs(dx) > w * 0.35 || fast)) {
      row.style.transform = `translateX(${dx > 0 ? w : -w}px)`;
      item.style.maxHeight = item.offsetHeight + 'px';
      requestAnimationFrame(() => item.classList.add('gone'));
      const id = Number(row.dataset.sid);
      setTimeout(() => { queueDelete(id); renderScansPanel(); }, 330);
    } else {
      row.style.transform = '';
      setTimeout(renderScansPanel, 200);   // catch up on anything held during the drag
    }
  };
  row.addEventListener('pointerup', end);
  row.addEventListener('pointercancel', end);
}

let sweepWasActive = false, sweepActive = false, sweepStopRequested = false;
function renderSweep(sw) {
  const btn = $('#p-fill'), info = $('#sweepInfo');
  sweepActive = !!sw?.active;
  if (sweepActive) {
    sweepWasActive = true;
    // The button flips into a stop control while the sweep runs; tapping
    // Price missing again afterwards restarts from whatever is unpriced.
    btn.disabled = !!sw.cancelling;
    btn.textContent = sw.cancelling ? 'Stopping…' : `■ Stop (${sw.done}/${sw.total})`;
    info.style.display = 'block';
    info.textContent = `Searching F2F: ${sw.current || '…'}`
      + (sw.eta_s != null ? ` · ~${sw.eta_s}s left` : '')
      + (sw.pace_s ? ` · pace 1/${sw.pace_s}s` : '');
  } else {
    btn.disabled = false;
    btn.textContent = 'Price missing';
    if (sw?.cooldown_s > 0) {
      info.style.display = 'block';
      info.textContent = `⏸ F2F throttled — auto-sweep resumes in ${sw.cooldown_s}s (Price missing overrides)`;
    } else if (sw?.next_check_s != null) {
      info.style.display = 'block';
      info.textContent = `next price check in ~${sw.next_check_s}s`;
    } else {
      info.style.display = 'none';
    }
    if (sweepWasActive) {
      sweepWasActive = false;
      setStatus(sweepStopRequested ? 'Pricing sweep stopped.' : 'Pricing sweep finished.', 'ok');
      sweepStopRequested = false;
    }
  }
}

async function refreshScans() {

      fetch('/api/scans'), fetch('/api/price-status')]);

// "Scan size" (owner, 2026-10-02: "are we able to size either card to match the
