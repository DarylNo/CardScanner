<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Card Scanner — Camera</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif; background: #0f1115; color: #e8eaed;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }
  header { padding: 10px 14px; font-weight: 600; border-bottom: 1px solid #23262e;
           display: flex; align-items: center; justify-content: space-between; }
  #scansBtn {
    font-size: 14px; font-weight: 600; padding: 6px 12px; border: 0; border-radius: 8px;
    background: #23262e; color: #cbd2dc; flex: 0 0 auto; width: auto;
  }
  /* slide-over scans list */
  #scansPanel {
    position: fixed; inset: 0; background: #0f1115; z-index: 20; display: none;
    flex-direction: column;
  }
  #scansPanel.open { display: flex; }
  #scansPanel header { flex: 0 0 auto; }
  #scansList { flex: 1; overflow-y: auto; }
  .srow { display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #1b1e26; align-items: center; }
  .srow img { width: 44px; height: 62px; object-fit: cover; border-radius: 4px; background: #23262e; }
  .srow .meta { flex: 1; min-width: 0; }
  .srow .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .sub { font-size: 12px; color: #8b93a1; }
  .spill { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #3f2d10; color: #fbbf24; }
  .spill.sel { background: #14532d; color: #86efac; }
  .sprice { color: #6ee7a0; font-weight: 700; }
  #stage { position: relative; flex: 1; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; }
  /* Card framing guide (2.5 : 3.5 aspect) */
  #guide {
    position: absolute; inset: 0; margin: auto; width: 72%; max-width: 340px;
    aspect-ratio: 5 / 7; border: 3px solid rgba(120,200,255,.8); border-radius: 14px;
    box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); pointer-events: none;
  }
  #guide.armed { border-color: rgba(110,231,160,.9); }
  #guide.busy  { border-color: rgba(251,191,36,.9); }
  footer { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  #status { min-height: 1.3em; text-align: center; font-size: 14px; color: #aeb4bf; }
  #status.ok { color: #6ee7a0; } #status.err { color: #ff8a8a; }
  .btnrow { display: flex; gap: 10px; }
  button {
    font-size: 19px; font-weight: 600; padding: 16px; border: 0; border-radius: 12px;
    background: #3b82f6; color: #fff; flex: 1;
  }
  button:disabled { background: #2a2f3a; color: #7b8290; }
  #autoBtn { flex: 0 0 34%; background: #14532d; color: #86efac; }
  #autoBtn.off { background: #23262e; color: #7b8290; }
  .hint { font-size: 12px; color: #7b8290; text-align: center; }
</style>
</head>
<body>
  <header>📷 Scanner — point at a card
    <button id="scansBtn">Scans</button>
  </header>
  <div id="scansPanel">
    <header>🃏 Scanned cards
      <button id="scansClose" style="font-size:14px;font-weight:600;padding:6px 12px;border:0;border-radius:8px;background:#23262e;color:#cbd2dc;width:auto">Close</button>
    </header>
    <div id="scansList"></div>
  </div>
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="guide"></div>
  </div>
  <footer>
    <div id="status">Starting camera…</div>
    <div class="btnrow">
      <button id="autoBtn">Auto: ON</button>
      <button id="shoot" disabled>Scan Card</button>
    </div>
    <div class="hint">Place a card in the frame — it scans by itself. Swap cards to scan the next.</div>
  </footer>
  <canvas id="canvas" hidden></canvas>
  <canvas id="motion" hidden></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const motion = document.getElementById('motion');
const statusEl = document.getElementById('status');
const guide = document.getElementById('guide');
const shoot = document.getElementById('shoot');
const autoBtn = document.getElementById('autoBtn');
const BURST = 3, BURST_GAP_MS = 120;
// Upload size cap: identification pHashes downsample to 32×32, and the
// printing ranker works from Scryfall `normal` images — 1280px q0.85 uploads
// are hash-equivalent to full-res but ~3× smaller (faster over Wi-Fi).
const MAX_UPLOAD_DIM = 1280, JPEG_QUALITY = 0.85;

// ── auto-scan tunables ────────────────────────────────────────────────────────
// The rig is a fixed mount over a tray, so the scene is static except when a
// hand places/removes a card. We watch a 64×48 grayscale downsample at 5 fps:
// a mean-abs-diff spike vs the last SETTLED scene arms the machine, N
// consecutive stable frames fire the scan, and the settled reference then
// re-seeds so the same card is never rescanned until the scene changes again.
const MOTION_W = 64, MOTION_H = 48, SAMPLE_MS = 200;
const DIFF_TRIGGER = 9;    // vs settledRef: scene meaningfully changed
const DIFF_STABLE = 3;     // vs previous sample: motion has stopped
const STABLE_FRAMES = 4;   // ~0.8 s of stillness before scanning — raise if it
                           // ever fires while your hand is still in frame
const COOLDOWN_MS = 1000;

let autoEnabled = true;
let mode = 'idle';         // idle | settling | scanning | cooldown
let settledRef = null;     // last settled scene (Uint8ClampedArray gray)
let emptyRef = null;       // the empty tray, seeded at startup
let prevFrame = null;
let stableCount = 0;

function setStatus(msg, cls='') { statusEl.textContent = msg; statusEl.className = cls; }
function setGuide(state) { guide.className = state; }

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus('Camera needs HTTPS. Open this page over https:// (see README).', 'err');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    shoot.disabled = false;
    setStatus('Auto: waiting for a steady view…');
  } catch (e) {
    setStatus('Camera blocked: ' + e.message + ' (HTTPS required on phones).', 'err');
  }
}

// ── screen wake lock — a hands-free mount dies if the screen sleeps ──────────
let wakeLock = null;
async function acquireWakeLock() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) { /* unsupported */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') acquireWakeLock();
});
acquireWakeLock();

// ── frame capture (full-res burst for the server) ────────────────────────────
function grabFrame() {
  const scale = Math.min(1, MAX_UPLOAD_DIM / Math.max(video.videoWidth, video.videoHeight));
  const w = Math.round(video.videoWidth * scale), h = Math.round(video.videoHeight * scale);
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(video, 0, 0, w, h);
  return new Promise(res => canvas.toBlob(b => res(b), 'image/jpeg', JPEG_QUALITY));
}

async function captureBurst() {
  const frames = [];
  for (let i = 0; i < BURST; i++) {
    frames.push(await grabFrame());
    if (i < BURST - 1) await new Promise(r => setTimeout(r, BURST_GAP_MS));
  }
  return frames;
}

async function scanOnce() {
  setGuide('busy');
  setStatus('Capturing…');
  try {
    const frames = await captureBurst();
    setStatus('Scanning…');
    const fd = new FormData();
    frames.forEach((b, i) => fd.append('files', b, `frame${i}.jpg`));
    const r = await fetch('/api/scan', { method: 'POST', body: fd });
    const data = await r.json();
    if (data.identified) {
      const n = (data.candidates || []).length;
      setStatus(`✓ ${data.card_read.name} — ${n} printings. Pick it on the desktop.`, 'ok');
    } else {
      setStatus('✗ ' + (data.error || 'Could not read card. Try again.'), 'err');
    }
  } catch (e) {
    setStatus('Upload failed: ' + e.message, 'err');
  } finally {
    setGuide(autoEnabled ? 'armed' : '');
  }
}

// ── motion detection ─────────────────────────────────────────────────────────
function sampleSmallGray() {
  if (!video.videoWidth) return null;
  motion.width = MOTION_W; motion.height = MOTION_H;
  const ctx = motion.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, 0, 0, MOTION_W, MOTION_H);
  const { data } = ctx.getImageData(0, 0, MOTION_W, MOTION_H);
  const gray = new Uint8ClampedArray(MOTION_W * MOTION_H);
  for (let i = 0, j = 0; j < gray.length; i += 4, j++) {
    gray[j] = (data[i] + 2 * data[i + 1] + data[i + 2]) >> 2;
  }
  return gray;
}

function meanDiff(a, b) {
  let sum = 0;
  for (let i = 0; i < a.length; i++) sum += Math.abs(a[i] - b[i]);
  return sum / a.length;
}

function tick() {
  if (!autoEnabled || mode === 'scanning' || mode === 'cooldown') return;
  const cur = sampleSmallGray();
  if (!cur) return;

  if (settledRef === null) {
    // Bootstrap: wait for the first steady second, seed both references.
    // The mount points at an EMPTY tray at startup, so this also learns
    // what "no card" looks like (card removal then never triggers a scan).
    if (prevFrame && meanDiff(cur, prevFrame) < DIFF_STABLE) stableCount++;
    else stableCount = 0;
    if (stableCount >= STABLE_FRAMES) {
      settledRef = cur; emptyRef = cur; stableCount = 0;
      setGuide('armed');
      setStatus('Auto: watching…');
    }
  } else if (mode === 'idle') {
    if (meanDiff(cur, settledRef) > DIFF_TRIGGER) {
      mode = 'settling'; stableCount = 0;
      setStatus('Change detected — hold still…');
    }
  } else if (mode === 'settling') {
    if (meanDiff(cur, prevFrame) < DIFF_STABLE) stableCount++;
    else stableCount = 0;

    if (meanDiff(cur, settledRef) <= DIFF_TRIGGER) {
      mode = 'idle';                      // transient (hand wave) — scene unchanged
      setStatus('Auto: watching…');
    } else if (stableCount >= STABLE_FRAMES) {
      settledRef = cur; stableCount = 0;
      if (emptyRef && meanDiff(cur, emptyRef) <= DIFF_TRIGGER) {
        mode = 'idle';                    // card was REMOVED — silently re-arm
        setStatus('Auto: watching…');
      } else {
        mode = 'scanning';
        scanOnce().finally(() => {
          mode = 'cooldown';
          setTimeout(() => { mode = 'idle'; }, COOLDOWN_MS);
        });
      }
    }
  }
  prevFrame = cur;
}
setInterval(tick, SAMPLE_MS);

// ── controls ─────────────────────────────────────────────────────────────────
autoBtn.addEventListener('click', () => {
  autoEnabled = !autoEnabled;
  autoBtn.textContent = autoEnabled ? 'Auto: ON' : 'Auto: OFF';
  autoBtn.classList.toggle('off', !autoEnabled);
  setGuide(autoEnabled && settledRef ? 'armed' : '');
  if (autoEnabled) { mode = 'idle'; settledRef = null; prevFrame = null; stableCount = 0;
                     setStatus('Auto: waiting for a steady view…'); }
  else setStatus('Auto off — tap Scan Card.');
});

shoot.addEventListener('click', async () => {
  shoot.disabled = true;
  mode = 'scanning';
  try {
    await scanOnce();
  } finally {
    settledRef = sampleSmallGray() || settledRef;  // don't auto-refire on this scene
    mode = 'idle';
    setTimeout(() => { shoot.disabled = false; }, 400);
  }
});

// ── scanned-cards panel ──────────────────────────────────────────────────────
const scansPanel = document.getElementById('scansPanel');
const scansList = document.getElementById('scansList');
const scansBtn = document.getElementById('scansBtn');
let scansTimer = null;

const escHtml = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function f2fBest(scan) {
  const c = scan.f2f?.conditions || {};
  const cond = scan.selection?.condition || 'NM';
  const order = { NM:['NM','PL'], LP:['PL','NM'], MP:['MP','PL','NM'],
                  HP:['HP','PL','NM'], DMG:['DMG','HP','PL','NM'] }[cond] || ['NM'];
  for (const k of order) if (c[k] != null) return c[k];
  const vals = Object.values(c); return vals.length ? Math.min(...vals) : null;
}

async function refreshScans() {
  try {
    const scans = await (await fetch('/api/scans')).json();
    scansBtn.textContent = `Scans (${scans.length})`;
    if (!scansPanel.classList.contains('open')) return;
    scansList.innerHTML = scans.map(s => {
      const sel = s.status === 'selected';
      const name = s.selection?.name || s.card_read?.name || '(unread)';
      const thumb = s.selection?.image_normal || s.candidates?.[0]?.image_small
                    || `/api/scans/${s.id}/image`;
      const price = sel ? f2fBest(s) : null;
      const sub = sel
        ? `${(s.selection.set||'').toUpperCase()} #${s.selection.collector_number} · ${s.selection.condition} · ${s.selection.finish} · ×${s.selection.quantity}`
        : `${(s.candidates||[]).length} printings — pick on desktop`;
      return `<div class="srow">
        <img src="${escHtml(thumb)}" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="meta">
          <div class="nm">${escHtml(name)}</div>
          <div class="sub">${escHtml(sub)}</div>
        </div>
        ${price != null ? `<div class="sprice">$${price}</div>` : ''}
        <span class="spill ${sel?'sel':''}">${sel?'selected':'pending'}</span>
      </div>`;
    }).join('') || `<div style="padding:40px;text-align:center;color:#6b7280">No scans yet.</div>`;
  } catch (e) { /* server momentarily unreachable */ }
}

scansBtn.addEventListener('click', () => {
  scansPanel.classList.add('open');
  refreshScans();
  scansTimer = setInterval(refreshScans, 3000);
});
document.getElementById('scansClose').addEventListener('click', () => {
  scansPanel.classList.remove('open');
  clearInterval(scansTimer); scansTimer = null;
});
setInterval(() => { if (!scansPanel.classList.contains('open')) refreshScans(); }, 5000);
refreshScans();

startCamera();
</script>
</body>
</html>
