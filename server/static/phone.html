<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Card Scanner — Camera</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif; background: #0f1115; color: #e8eaed;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }
  header { padding: 10px 14px; font-weight: 600; border-bottom: 1px solid #23262e;
           display: flex; align-items: center; justify-content: space-between; }
  #scansBtn {
    font-size: 14px; font-weight: 600; padding: 6px 12px; border: 0; border-radius: 8px;
    background: #23262e; color: #cbd2dc; flex: 0 0 auto; width: auto;
  }
  /* slide-over scans list */
  #scansPanel {
    position: fixed; inset: 0; background: #0f1115; z-index: 20; display: none;
    flex-direction: column;
  }
  #scansPanel.open { display: flex; }
  #scansPanel header { flex: 0 0 auto; }
  #scansList { flex: 1; overflow-y: auto; }
  #scansBar { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #23262e;
              overflow-x: auto; flex: 0 0 auto; align-items: center; }
  .vchip { font-size: 13px; padding: 6px 12px; border-radius: 999px; background: #23262e;
           color: #cbd2dc; white-space: nowrap; flex: 0 0 auto; border: 1px solid transparent; }
  .vchip.on { background: #1c2740; border-color: #3b82f6; color: #cfe1ff; }
  #scansStat { font-size: 12px; color: #8b93a1; padding: 6px 12px; flex: 0 0 auto; }
  #scansStat b { color: #e8eaed; } #scansStat .money { color: #6ee7a0; }
  #priceBar { display: flex; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #23262e;
              flex: 0 0 auto; align-items: center; }
  #priceBar input { width: 84px; padding: 8px 10px; border-radius: 8px; border: 1px solid #2a2f3a;
                    background: #0f1115; color: #e8eaed; font: inherit; }
  #priceBar button { flex: 0 0 auto; width: auto; font-size: 13px; font-weight: 600;
                     padding: 8px 12px; background: #23262e; color: #cbd2dc; }
  .srow { display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #1b1e26; align-items: center; }
  .srow img { width: 44px; height: 62px; object-fit: cover; border-radius: 4px; background: #23262e; }
  .srow .meta { flex: 1; min-width: 0; }
  .srow .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .sub { font-size: 12px; color: #8b93a1; }
  .spill { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #3f2d10; color: #fbbf24; }
  .spill.sel { background: #14532d; color: #86efac; }
  .sprice { color: #6ee7a0; font-weight: 700; }
  /* scan detail: pick a printing on the phone */
  #detailPanel {
    position: fixed; inset: 0; background: #0f1115; z-index: 30; display: none;
    flex-direction: column;
  }
  #detailPanel.open { display: flex; }
  #detailBody { flex: 1; overflow-y: auto; padding: 12px 14px 24px; }
  .prow { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
  .prow img { width: 110px; border-radius: 8px; background: #23262e; }
  .pctl { display: flex; gap: 8px; margin: 10px 0 14px; flex-wrap: wrap; }
  .pctl select, .pctl input {
    padding: 8px 10px; border-radius: 8px; border: 1px solid #2a2f3a;
    background: #0f1115; color: #e8eaed; font: inherit;
  }
  .pctl input { width: 64px; }
  .pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pcard { border: 2px solid transparent; border-radius: 8px; background: #171a21; padding: 5px; }
  .pcard.chosen { border-color: #22c55e; }
  .pcard img { width: 100%; border-radius: 5px; aspect-ratio: 5/7; object-fit: cover; background: #23262e; display: block; }
  .pcard .pt { font-size: 11px; margin-top: 4px; line-height: 1.25; color: #cbd2dc; }
  .pprice { font-size: 18px; font-weight: 700; color: #6ee7a0; margin: 6px 0; }
  .msrow { display: flex; gap: 8px; margin-top: 8px; }
  .msrow input { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #2a2f3a; background: #0f1115; color: #e8eaed; font: inherit; }
  .msrow button { flex: 0 0 auto; width: auto; font-size: 14px; padding: 8px 14px; background: #23262e; color: #cbd2dc; }
  .subhead { font-size: 13px; color: #8b93a1; margin: 14px 0 8px; font-weight: 600; }
  .dangerbtn { background: #3a1c1c; color: #fca5a5; font-size: 14px; padding: 10px; margin-top: 18px; }
  #stage { position: relative; flex: 1; background: #000; overflow: hidden; }
  /* contain, not cover: the preview must show EXACTLY the frame that gets
     captured — cover was hiding parts of the card that the scan then saw */
  video { width: 100%; height: 100%; object-fit: contain; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* recent-scan chips over the bottom of the camera view */
  #recent { display: flex; gap: 6px; padding: 4px 10px; overflow-x: auto; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #23262e;
          color: #cbd2dc; white-space: nowrap; flex: 0 0 auto; }
  .chip.selchip { background: #14532d; color: #86efac; }
  /* full-screen image viewer */
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 40;
              display: none; align-items: center; justify-content: center; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 96vw; max-height: 92vh; border-radius: 10px; }
  footer { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  #status { min-height: 1.3em; text-align: center; font-size: 14px; color: #aeb4bf; }
  #status.ok { color: #6ee7a0; } #status.err { color: #ff8a8a; }
  .btnrow { display: flex; gap: 10px; }
  button {
    font-size: 19px; font-weight: 600; padding: 16px; border: 0; border-radius: 12px;
    background: #3b82f6; color: #fff; flex: 1;
  }
  button:disabled { background: #2a2f3a; color: #7b8290; }
  #autoBtn { flex: 0 0 34%; background: #14532d; color: #86efac; }
  #autoBtn.off { background: #23262e; color: #7b8290; }
  .hint { font-size: 12px; color: #7b8290; text-align: center; }
</style>
</head>
<body>
  <header>📷 Scanner — point at a card
    <button id="scansBtn">Scans</button>
  </header>
  <div id="scansPanel">
    <header>🃏 Scanned cards
      <button id="scansClose" style="font-size:14px;font-weight:600;padding:6px 12px;border:0;border-radius:8px;background:#23262e;color:#cbd2dc;width:auto">Close</button>
    </header>
    <div id="scansBar">
      <span class="vchip on" data-view="all">All</span>
      <span class="vchip" data-view="pending">Needs pick</span>
      <span class="vchip" data-view="selected">Selected</span>
      <span class="vchip" data-view="problem">Problems</span>
    </div>
    <div id="priceBar">
      <input id="p-min" type="number" min="0" step="0.25" placeholder="Min $" inputmode="decimal">
      <input id="p-max" type="number" min="0" step="0.25" placeholder="Max $" inputmode="decimal">
      <button id="p-excl">Exclude filtered</button>
    </div>
    <div id="scansStat"></div>
    <div id="scansList"></div>
  </div>
  <div id="detailPanel">
    <header><span id="detailTitle">Card</span>
      <button id="detailBack" style="font-size:14px;font-weight:600;padding:6px 12px;border:0;border-radius:8px;background:#23262e;color:#cbd2dc;width:auto">Back</button>
    </header>
    <div id="detailBody"></div>
  </div>
  <div id="lightbox"><img id="lightboxImg" alt=""></div>
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <footer>
    <div id="recent"></div>
    <div id="status">Starting camera…</div>
    <div class="btnrow">
      <button id="autoBtn">Auto: ON</button>
      <button id="shoot" disabled>Scan Card</button>
    </div>
    <div class="hint">Place a card in the frame — it scans by itself. Swap cards to scan the next.</div>
  </footer>
  <canvas id="canvas" hidden></canvas>
  <canvas id="motion" hidden></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const motion = document.getElementById('motion');
const statusEl = document.getElementById('status');
const overlay = document.getElementById('overlay');
const shoot = document.getElementById('shoot');
const autoBtn = document.getElementById('autoBtn');
const BURST = 3, BURST_GAP_MS = 120;
// Upload size cap: identification pHashes downsample to 32×32, and the
// printing ranker works from Scryfall `normal` images — 1280px q0.85 uploads
// are hash-equivalent to full-res but ~3× smaller (faster over Wi-Fi).
const MAX_UPLOAD_DIM = 1280, JPEG_QUALITY = 0.85;

// ── card detection & auto-scan ───────────────────────────────────────────────
// The rig is a fixed mount over a tray. Every tick (5 fps) we downsample the
// frame and find the card by TEXTURE, not by brightness difference:
//
//   card pixel  =  locally textured NOW  and  smooth in the empty tray
//                  (or) massively different from the empty tray
//
// A Magic card is edges everywhere — border, art detail, rules text — while
// the tray is smooth plastic. Crucially the pale textbox, which defeated every
// brightness-difference approach (white card on white tray), is packed with
// black text and so lights up strongly under a gradient measure. Subtracting
// the empty tray's own texture keeps the static mount/lamp at the top of the
// frame out of the box, and using gradients rather than absolute levels makes
// the whole thing immune to lighting drift.
//
// Debug: open /phone?debug to see the live numbers and tune constants.
// 176 px wide, not 96: at 96 a card filling ~30% of the frame is only ~29
// samples across, so its thin black border and its rules text both average
// away — leaving ONLY the art textured, and the box locked onto the art
// alone. At 176 the border survives as ~1-2 samples and coarse text strokes
// register, which is what ties the whole card together.
const MW = 176, SAMPLE_MS = 200;
// MH tracks the video's aspect so sample pixels stay square.
let MH = 132;
const PIX_DELTA = 25;        // gray levels — per-pixel "really changed" bar
const GRAD_THR = 14;         // gradient magnitude counted as "textured"
const STABLE_FRAC = 0.010;   // vs previous sample: <1% changed → motion stopped
const EMPTY_FRAC = 0.015;    // card mask below this → tray is empty
const SWAP_FRAC = 0.06;      // vs frame at last scan: enough change = new card
const STABLE_FRAMES = 3;     // ~0.6 s of steady card before scanning
const DEBUG = new URLSearchParams(location.search).has('debug');

let autoEnabled = true;
let mode = 'watching';       // watching | scanning | awaitNext
let emptyRef = null;         // the empty tray (adaptive — refreshed when idle)
let emptyGrad = null;        // its texture map
let prevFrame = null, prevBox = null, scannedFrame = null;
let stableCount = 0, bootCount = 0, emptyRefreshTick = 0;

function setStatus(msg, cls='') { statusEl.textContent = msg; statusEl.className = cls; }

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus('Camera needs HTTPS. Open this page over https:// (see README).', 'err');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    shoot.disabled = false;
    setStatus('Auto: waiting for a steady view…');
  } catch (e) {
    setStatus('Camera blocked: ' + e.message + ' (HTTPS required on phones).', 'err');
  }
}

// ── screen wake lock — a hands-free mount dies if the screen sleeps ──────────
let wakeLock = null;
async function acquireWakeLock() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) { /* unsupported */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') acquireWakeLock();
});
acquireWakeLock();

// ── frame capture (full-res burst for the server) ────────────────────────────
function grabFrame() {
  const scale = Math.min(1, MAX_UPLOAD_DIM / Math.max(video.videoWidth, video.videoHeight));
  const w = Math.round(video.videoWidth * scale), h = Math.round(video.videoHeight * scale);
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(video, 0, 0, w, h);
  return new Promise(res => canvas.toBlob(b => res(b), 'image/jpeg', JPEG_QUALITY));
}

async function captureBurst() {
  const frames = [];
  for (let i = 0; i < BURST; i++) {
    frames.push(await grabFrame());
    if (i < BURST - 1) await new Promise(r => setTimeout(r, BURST_GAP_MS));
  }
  return frames;
}

async function scanOnce() {
  setStatus('Capturing…');
  try {
    const frames = await captureBurst();
    setStatus('Scanning…');
    const fd = new FormData();
    frames.forEach((b, i) => fd.append('files', b, `frame${i}.jpg`));
    const r = await fetch('/api/scan', { method: 'POST', body: fd });
    const data = await r.json();
    if (data.no_card) {
      // Server saw nothing card-like — whatever we thought was a card isn't.
      // Adopt the current scene as the new "empty" so we stop firing on it.
      setStatus('No card detected.', 'err');
      const s = sampleSmallGray();
      if (s) { emptyRef = s; emptyGrad = gradMap(s); }
    } else if (data.identified) {
      const n = (data.candidates || []).length;
      setStatus(`✓ ${data.card_read.name} — ${n} printings. Swap card for the next.`, 'ok');
    } else {
      setStatus('✗ ' + (data.error || 'Could not read card. Try again.'), 'err');
    }
    refreshScans();
  } catch (e) {
    setStatus('Upload failed: ' + e.message, 'err');
  }
}

// ── frame sampling + card boundary detection ─────────────────────────────────
function sampleSmallGray() {
  if (!video.videoWidth) return null;
  const wantMH = Math.max(48, Math.round(MW * video.videoHeight / video.videoWidth));
  if (wantMH !== MH) {
    // Video aspect (re)learned — old references are in the wrong geometry.
    MH = wantMH;
    emptyRef = null; emptyGrad = null; prevFrame = null; prevBox = null; bootCount = 0;
  }
  motion.width = MW; motion.height = MH;
  const ctx = motion.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, 0, 0, MW, MH);
  const { data } = ctx.getImageData(0, 0, MW, MH);
  const gray = new Uint8ClampedArray(MW * MH);
  for (let i = 0, j = 0; j < gray.length; i += 4, j++) {
    gray[j] = (data[i] + 2 * data[i + 1] + data[i + 2]) >> 2;
  }
  return gray;
}

function changedFrac(a, b) {
  let n = 0;
  for (let i = 0; i < a.length; i++) if (Math.abs(a[i] - b[i]) > PIX_DELTA) n++;
  return n / a.length;
}

function mainBand(counts, thr) {
  // Longest contiguous run where the per-row/column changed-pixel count is
  // meaningful. This is what keeps the box on the CARD: a faint shadow band
  // or exposure drift near the mount contributes a few pixels per row, which
  // a raw min/max bounding box happily stretches to — observed dragging the
  // box far above the card and tanking its density.
  let best = null, a = -1;
  for (let i = 0; i <= counts.length; i++) {
    const on = i < counts.length && counts[i] >= thr;
    if (on && a < 0) a = i;
    if (!on && a >= 0) {
      if (!best || (i - a) > (best.b - best.a + 1)) best = { a, b: i - 1 };
      a = -1;
    }
  }
  return best;
}

function expandBand(counts, band, lowThr) {
  // Grow the dense core outward through rows/columns that still carry SOME
  // mass. A card's pale textbox rows register only the thin dark borders
  // (~a few pixels) — far below the core threshold but well above a clean
  // tray row — so the core (the art block) must extend through them to the
  // card's true edge, while an isolated shadow band beyond clean tray rows
  // still can't join.
  let { a, b } = band;
  while (a > 0 && counts[a - 1] >= lowThr) a--;
  while (b < counts.length - 1 && counts[b + 1] >= lowThr) b++;
  return { a, b };
}

function gradMap(gray) {
  // |dx| + |dy| — cheap gradient magnitude ("how textured is this pixel").
  const g = new Uint8ClampedArray(MW * MH);
  for (let y = 1; y < MH - 1; y++) {
    for (let x = 1; x < MW - 1; x++) {
      const i = y * MW + x;
      g[i] = Math.min(255,
        Math.abs(gray[i + 1] - gray[i - 1]) + Math.abs(gray[i + MW] - gray[i - MW]));
    }
  }
  return g;
}

function cardMask(cur, curGrad) {
  // Textured now + smooth when empty  →  card detail (art, text, borders).
  // Or hugely different from empty     →  solid regions (dark border on tray).
  const mask = new Uint8Array(MW * MH);
  for (let i = 0; i < mask.length; i++) {
    if ((curGrad[i] > GRAD_THR && emptyGrad[i] <= GRAD_THR) ||
        Math.abs(cur[i] - emptyRef[i]) > PIX_DELTA * 2) mask[i] = 1;
  }
  // Morphological close (dilate → erode) with a 3×3 kernel: bridges the gaps
  // between a card's separate signal islands — art block, title text, rules
  // text, outer border — so they read as ONE object instead of the box
  // snapping to the art alone.
  const dil = new Uint8Array(MW * MH);
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      let on = 0;
      for (let dy = -1; dy <= 1 && !on; dy++) {
        for (let dx = -1; dx <= 1 && !on; dx++) {
          const yy = y + dy, xx = x + dx;
          if (yy >= 0 && yy < MH && xx >= 0 && xx < MW && mask[yy * MW + xx]) on = 1;
        }
      }
      dil[y * MW + x] = on;
    }
  }
  return dil;
}

function detectBox(cur) {
  const curGrad = gradMap(cur);
  const mask = cardMask(cur, curGrad);
  const rows = new Uint16Array(MH), cols = new Uint16Array(MW);
  let n = 0;
  for (let y = 0; y < MH; y++) {
    for (let x = 0; x < MW; x++) {
      if (mask[y * MW + x]) { rows[y]++; cols[x]++; n++; }
    }
  }
  if (!n) return null;
  const rMax = Math.max(...rows), cMax = Math.max(...cols);
  // Dense core (the card body), then grow outward through anything still
  // carrying mass — stops at clean tray rows, so a detached shadow band or
  // the static mount can never join the box.
  let rband = mainBand(rows, Math.max(2, rMax * 0.30));
  let cband = mainBand(cols, Math.max(2, cMax * 0.30));
  if (!rband || !cband) return null;
  // Grow on a near-absolute floor: a row crossing the card's pale textbox
  // may only carry its two border pixels, which any percentage-of-max floor
  // would reject (the art block makes rMax large). Growth still stops dead
  // at genuinely clean tray rows.
  rband = expandBand(rows, rband, Math.max(2, rMax * 0.04));
  cband = expandBand(cols, cband, Math.max(2, cMax * 0.04));
  let m = 0;
  for (let y = rband.a; y <= rband.b; y++)
    for (let x = cband.a; x <= cband.b; x++)
      if (mask[y * MW + x]) m++;
  const w = cband.b - cband.a + 1, h = rband.b - rband.a + 1;
  return {
    x: cband.a, y: rband.a, w, h,
    areaFrac: (w * h) / (MW * MH),    // how much of the frame the box covers
    density: m / (w * h),             // how solid the box is (card ≈ solid)
    aspect: w / h,
    ratio: Math.max(w, h) / Math.min(w, h),   // orientation-agnostic shape
  };
}

function looksLikeCard(b) {
  // Shape is checked ORIENTATION-AGNOSTICALLY (long side / short side): the
  // phone may be mounted in either rotation and cards get laid down sideways,
  // so a portrait-only window silently rejected perfectly good scans.
  // A real card is 88:63 ≈ 1.40; the window allows tilt and edge slop.
  // Density stays generous — smooth art passages legitimately carry little
  // texture; the floor only rejects sparse smears.
  return !!b && b.areaFrac > 0.03 && b.areaFrac < 0.92
      && b.density > 0.35
      && b.ratio > 1.15 && b.ratio < 1.95;
}

function boxStable(a, b) {
  // Borderline pixels at the box edge flicker frame-to-frame (especially
  // where pale card regions meet the pale tray) — allow a little wobble.
  if (!a || !b) return false;
  return Math.abs(a.x - b.x) + Math.abs(a.y - b.y)
       + Math.abs(a.w - b.w) + Math.abs(a.h - b.h) <= 7;
}

// Draw the detected boundary on the preview (video is object-fit: contain,
// so map sample coords → video coords → letterboxed display coords).
// captured=true paints the card solid blue with a large white check — the
// visual confirmation that this exact region was sent off for analysis.
function drawOverlay(box, color, captured = false) {
  const cw = overlay.clientWidth, ch = overlay.clientHeight;
  if (overlay.width !== cw) overlay.width = cw;
  if (overlay.height !== ch) overlay.height = ch;
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, cw, ch);
  if (!box || !video.videoWidth) return;
  const s = Math.min(cw / video.videoWidth, ch / video.videoHeight);
  const ox = (cw - video.videoWidth * s) / 2, oy = (ch - video.videoHeight * s) / 2;
  const fx = video.videoWidth / MW * s, fy = video.videoHeight / MH * s;
  const bx = ox + box.x * fx, by = oy + box.y * fy;
  const bw = box.w * fx, bh = box.h * fy;

  ctx.beginPath();
  ctx.roundRect(bx, by, bw, bh, 12);
  if (captured) {
    ctx.fillStyle = 'rgba(59,130,246,.62)';
    ctx.fill();
    ctx.strokeStyle = '#93c5fd';
    ctx.lineWidth = 4;
    ctx.stroke();
    // Checkmark, sized to the card
    const cx = bx + bw / 2, cy = by + bh / 2, r = Math.min(bw, bh) * 0.3;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = Math.max(6, r * 0.22);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.75, cy);
    ctx.lineTo(cx - r * 0.15, cy + r * 0.6);
    ctx.lineTo(cx + r * 0.8, cy - r * 0.6);
    ctx.stroke();
  } else {
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}

function dbg(msg) { if (DEBUG) setStatus(msg); }

// ── state machine: detect → show boundary → capture → analyze → await next ──
function tick() {
  if (!autoEnabled || mode === 'scanning') return;
  const cur = sampleSmallGray();
  if (!cur) return;

  if (!emptyRef) {
    // Bootstrap: the first steady second teaches us the empty tray.
    if (prevFrame && changedFrac(cur, prevFrame) < STABLE_FRAC) bootCount++;
    else bootCount = 0;
    if (bootCount >= STABLE_FRAMES + 1) {
      emptyRef = cur; emptyGrad = gradMap(cur); bootCount = 0;
      setStatus('Auto: watching for a card…');
    }
    prevFrame = cur; return;
  }

  const box = detectBox(cur);
  const cardish = looksLikeCard(box);

  if (mode === 'watching') {
    drawOverlay(box, cardish ? '#6ee7a0' : '#fbbf24');
    if (cardish && boxStable(box, prevBox) && changedFrac(cur, prevFrame) < STABLE_FRAC) {
      stableCount++;
      dbg(`card ${(box.areaFrac*100).toFixed(0)}% ratio ${box.ratio.toFixed(2)} dens ${(box.density*100).toFixed(0)}% steady ${stableCount}/${STABLE_FRAMES}`);
      if (!DEBUG) setStatus('Card detected — hold still…');
      if (stableCount >= STABLE_FRAMES) {
        stableCount = 0;
        scannedFrame = cur;
        mode = 'scanning';
        drawOverlay(box, null, true);   // solid blue + check: sent for analysis
        scanOnce().finally(() => { mode = 'awaitNext'; });
      }
    } else {
      stableCount = 0;
      if (box && !cardish) {
        dbg(`not card-like: area ${(box.areaFrac*100).toFixed(0)}% ratio ${box.ratio.toFixed(2)} dens ${(box.density*100).toFixed(0)}%`);
      } else if (!box) {
        dbg('watching — tray empty');
      }
      // Adaptive empty reference: truly empty and calm → slowly re-learn the
      // tray so lighting drift never accumulates into phantom boxes.
      if ((!box || box.areaFrac < EMPTY_FRAC) && prevFrame && changedFrac(cur, prevFrame) < STABLE_FRAC) {
        if (++emptyRefreshTick >= 25) { emptyRef = cur; emptyGrad = gradMap(cur); emptyRefreshTick = 0; }
      } else emptyRefreshTick = 0;
    }
  } else if (mode === 'awaitNext') {
    drawOverlay(box, '#8b93a1');
    const removed = !box || box.areaFrac < EMPTY_FRAC;
    const swapped = scannedFrame && cardish
                 && changedFrac(cur, scannedFrame) > SWAP_FRAC
                 && changedFrac(cur, prevFrame) < STABLE_FRAC;
    if (removed || swapped) {
      mode = 'watching'; stableCount = 0;
      setStatus(removed ? 'Auto: watching for a card…' : 'New card…');
    } else {
      dbg('awaiting next card (remove or swap)');
    }
  }

  prevBox = box; prevFrame = cur;
}
setInterval(tick, SAMPLE_MS);

// ── controls ─────────────────────────────────────────────────────────────────
autoBtn.addEventListener('click', () => {
  autoEnabled = !autoEnabled;
  autoBtn.textContent = autoEnabled ? 'Auto: ON' : 'Auto: OFF';
  autoBtn.classList.toggle('off', !autoEnabled);
  if (autoEnabled) { mode = 'watching'; stableCount = 0;
                     setStatus('Auto: watching for a card…'); }
  else { drawOverlay(null); setStatus('Auto off — tap Scan Card.'); }
});

shoot.addEventListener('click', async () => {
  shoot.disabled = true;
  mode = 'scanning';
  try {
    await scanOnce();
  } finally {
    scannedFrame = sampleSmallGray() || scannedFrame;  // don't auto-refire on this scene
    mode = 'awaitNext';
    setTimeout(() => { shoot.disabled = false; }, 400);
  }
});

// Double-tap the camera view to re-learn the empty tray (e.g. after loading
// the page with a card already in place, which bakes the card into the
// reference and makes further detection blind).
document.getElementById('stage').addEventListener('dblclick', () => {
  emptyRef = null; emptyGrad = null; prevFrame = null; prevBox = null;
  bootCount = 0; stableCount = 0; mode = 'watching';
  setStatus('Re-learning empty tray — clear it and hold steady…');
});

// ── scanned-cards panel ──────────────────────────────────────────────────────
const scansPanel = document.getElementById('scansPanel');
const scansList = document.getElementById('scansList');
const scansBtn = document.getElementById('scansBtn');
let scansTimer = null;

const escHtml = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function f2fBest(scan) {
  const c = scan.f2f?.conditions || {};
  const cond = scan.selection?.condition || 'NM';
  const order = { NM:['NM','PL'], LP:['PL','NM'], MP:['MP','PL','NM'],
                  HP:['HP','PL','NM'], DMG:['DMG','HP','PL','NM'] }[cond] || ['NM'];
  for (const k of order) if (c[k] != null) return c[k];
  const vals = Object.values(c); return vals.length ? Math.min(...vals) : null;
}

// F2F low–high across all listed conditions (works for pending scans too —
// the server prices the top-ranked printing in the background at scan time).
function priceRange(s) {
  const c = s.f2f?.conditions || {};
  const vals = Object.values(c);
  if (!vals.length) return null;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  return lo === hi ? `$${lo}` : `$${lo}–$${hi}`;
}

function renderRecent(scans) {
  // Newest-first working strip: tap a chip to open that scan (verify the
  // match, pick the printing, fix a misread) without leaving the camera.
  const el = document.getElementById('recent');
  el.innerHTML = scans.slice(-8).reverse().map(s => {
    const sel = s.status === 'selected';
    const name = s.selection?.name || s.card_read?.name || '?';
    const pr = priceRange(s);
    return `<span class="chip ${sel?'selchip':''}" data-sid="${s.id}">${escHtml(name)}${pr ? ' · ' + pr : ''}</span>`;
  }).join('');
  el.querySelectorAll('.chip[data-sid]').forEach(chip =>
    chip.addEventListener('click', () => openDetail(Number(chip.dataset.sid))));
}

let scansView = 'all';
let priceMin = null, priceMax = null;
const isProblem = s => !!s.error || !(s.candidates || []).length;

// Selected scans get their exact price; pending ones are judged on the
// background-priced top match, so bulk lots can be triaged before picking.
function priceOf(s) {
  const p = f2fBest(s);
  return p == null ? null : Number(p);
}
function inPriceRange(s) {
  if (priceMin == null && priceMax == null) return true;
  const p = priceOf(s);
  if (p == null) return true;            // unpriced never disappears
  if (priceMin != null && p < priceMin) return false;
  if (priceMax != null && p > priceMax) return false;
  return true;
}

async function refreshScans() {
  try {
    const scans = await (await fetch('/api/scans')).json();
    scansBtn.textContent = `Scans (${scans.length})`;
    renderRecent(scans);
    if (!scansPanel.classList.contains('open')) return;

    const sel = scans.filter(s => s.status === 'selected');
    const total = sel.filter(s => s.included)
      .reduce((t, s) => t + (f2fBest(s) ?? 0), 0);
    document.getElementById('scansStat').innerHTML =
      `<b>${scans.length}</b> scans · <b>${scans.length - sel.length}</b> to pick · ` +
      `<span class="money">$${total.toFixed(2)}</span> to export`;

    const rows = scans.filter(s => inPriceRange(s) && (
      scansView === 'all' ? true :
      scansView === 'pending' ? s.status !== 'selected' :
      scansView === 'selected' ? s.status === 'selected' :
      isProblem(s)));

    scansList.innerHTML = rows.slice().reverse().map(s => {
      const isSel = s.status === 'selected';
      const name = s.selection?.name || s.card_read?.name || '(unidentified)';
      const thumb = s.selection?.image_normal || s.candidates?.[0]?.image_small
                    || `/api/scans/${s.id}/image`;
      const pr = priceRange(s);
      const sub = isSel
        ? `${(s.selection.set||'').toUpperCase()} #${s.selection.collector_number} · ${s.selection.condition} · ${s.selection.finish} · ×${s.selection.quantity}`
        : `${(s.candidates||[]).length} printings — tap to pick`;
      const pill = isSel ? `<span class="spill sel">selected</span>`
                 : isProblem(s) ? `<span class="spill" style="background:#3a1c1c;color:#fca5a5">check</span>`
                 : `<span class="spill">pending</span>`;
      return `<div class="srow" data-sid="${s.id}">
        <img src="${escHtml(thumb)}" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="meta">
          <div class="nm">${escHtml(name)}</div>
          <div class="sub">${escHtml(sub)}</div>
        </div>
        ${pr ? `<div class="sprice">${pr}</div>` : ''}
        ${pill}
      </div>`;
    }).join('') || `<div style="padding:40px;text-align:center;color:#6b7280">Nothing here.</div>`;
    scansList.querySelectorAll('.srow[data-sid]').forEach(row =>
      row.addEventListener('click', () => openDetail(Number(row.dataset.sid))));
  } catch (e) { /* server momentarily unreachable */ }
}

document.querySelectorAll('.vchip').forEach(chip =>
  chip.addEventListener('click', () => {
    document.querySelectorAll('.vchip').forEach(c => c.classList.remove('on'));
    chip.classList.add('on');
    scansView = chip.dataset.view;
    refreshScans();
  }));

document.getElementById('p-min').addEventListener('input', e => {
  priceMin = e.target.value === '' ? null : Number(e.target.value); refreshScans();
});
document.getElementById('p-max').addEventListener('input', e => {
  priceMax = e.target.value === '' ? null : Number(e.target.value); refreshScans();
});
document.getElementById('p-excl').addEventListener('click', async () => {
  // Bulk-exclude every priced, still-included scan the filter hides.
  // Reversible per card from the desktop's include checkbox.
  const scans = await (await fetch('/api/scans')).json();
  const targets = scans.filter(s =>
    s.status === 'selected' && s.included && priceOf(s) != null && !inPriceRange(s));
  if (!targets.length) { setStatus('Nothing to exclude.'); return; }
  for (const s of targets) await jsend(`/api/scans/${s.id}`, 'PATCH', { included: false });
  refreshScans();
  setStatus(`Excluded ${targets.length} card${targets.length > 1 ? 's' : ''} from export.`, 'ok');
});

scansBtn.addEventListener('click', () => {
  scansPanel.classList.add('open');
  refreshScans();
  scansTimer = setInterval(refreshScans, 3000);
});
document.getElementById('scansClose').addEventListener('click', () => {
  scansPanel.classList.remove('open');
  clearInterval(scansTimer); scansTimer = null;
});
setInterval(() => { if (!scansPanel.classList.contains('open')) refreshScans(); }, 5000);
refreshScans();

// ── scan detail: pick a printing from the phone ──────────────────────────────
const detailPanel = document.getElementById('detailPanel');
const detailBody = document.getElementById('detailBody');
const detailTitle = document.getElementById('detailTitle');
const CONDITIONS = ['NM','LP','MP','HP','DMG'];
const FINISHES = ['Non-Foil','Foil','Etched'];
let detailScanId = null;

async function jsend(url, method, body) {
  return (await fetch(url, { method, headers: {'Content-Type':'application/json'},
                             body: JSON.stringify(body) })).json();
}

function pcandCard(c, chosenId) {
  return `<div class="pcard ${c.id===chosenId?'chosen':''}" data-pick="${escHtml(c.id)}">
    <img src="${escHtml(c.image_normal||c.image_small)}" loading="lazy" onerror="this.style.visibility='hidden'">
    <div class="pt"><b>${escHtml((c.set||'').toUpperCase())}</b> #${escHtml(c.collector_number)}
      ${c.multi_distance!=null?`· Δ${c.multi_distance}`:''}</div>
  </div>`;
}

function detailControls(scan) {
  const cr = scan.card_read || {};
  const condDefault = scan.selection?.condition || (cr.condition_estimate||'NM').toUpperCase();
  const cond = CONDITIONS.includes(condDefault) ? condDefault : 'NM';
  const fin = scan.selection?.finish || (cr.foil ? 'Foil' : 'Non-Foil');
  const qty = scan.selection?.quantity || 1;
  return `<div class="pctl">
    <select id="p-cond">${CONDITIONS.map(c=>`<option ${c===cond?'selected':''}>${c}</option>`).join('')}</select>
    <select id="p-fin">${FINISHES.map(f=>`<option ${f===fin?'selected':''}>${f}</option>`).join('')}</select>
    <input id="p-qty" type="number" min="1" value="${qty}">
  </div>`;
}

function detailCtl() {
  return {
    condition: document.getElementById('p-cond')?.value || 'NM',
    finish: document.getElementById('p-fin')?.value || 'Non-Foil',
    quantity: Number(document.getElementById('p-qty')?.value || 1),
  };
}

async function openDetail(id) {
  detailScanId = id;
  detailPanel.classList.add('open');
  await renderScanDetail();
}

async function renderScanDetail() {
  const scan = await (await fetch(`/api/scans/${detailScanId}`)).json();
  if (scan.error && !scan.id) { detailBody.innerHTML = `<p>${escHtml(scan.error)}</p>`; return; }
  const sel = scan.selection || null;
  const cr = scan.card_read || {};
  detailTitle.textContent = sel?.name || cr.name || '(unread)';

  let html = `<div class="prow">
    <img src="/api/scans/${scan.id}/image" onerror="this.style.display='none'">
    <div>
      ${sel ? `<div><b>${escHtml(sel.name)}</b></div>
        <div style="font-size:13px;color:#8b93a1">${escHtml(sel.set_name)} · ${escHtml((sel.set||'').toUpperCase())} #${escHtml(sel.collector_number)}</div>
        <div class="pprice">F2F: $${f2fBest(scan) ?? '—'}</div>`
      : `<div><b>${escHtml(cr.name||'(unread)')}</b></div>
        <div style="font-size:13px;color:#8b93a1">tap a printing below to select it</div>
        ${priceRange(scan) ? `<div class="pprice">~${priceRange(scan)} <span style="font-size:12px;color:#8b93a1;font-weight:400">(top match)</span></div>` : ''}`}
      ${scan.error ? `<div style="font-size:12px;color:#ff8a8a;margin-top:6px">${escHtml(scan.error)}</div>` : ''}
    </div>
  </div>`;

  html += detailControls(scan);
  html += `<div class="subhead">${sel ? 'Re-pick printing' : 'Pick the printing'} — closest first</div>`;
  html += (scan.candidates||[]).length
    ? `<div class="pgrid" id="pcands">${scan.candidates.map(c=>pcandCard(c, sel?.scryfall_id)).join('')}</div>`
    : `<p style="color:#8b93a1;font-size:13px">No candidates — search below.</p>`;

  html += `<div class="subhead">Wrong card? Search</div>
    <div class="msrow"><input id="p-search" placeholder="Card name…"><button id="p-searchBtn">Search</button></div>
    <div class="pgrid" id="psearchResults" style="margin-top:8px"></div>`;
  html += `<button class="dangerbtn" id="p-delete" style="width:100%">Delete this scan</button>`;
  detailBody.innerHTML = html;

  // Tap the scan photo to inspect it full-screen.
  const scanImg = detailBody.querySelector('.prow img');
  scanImg?.addEventListener('click', () => openLightbox(scanImg.src));

  // data-pick carries only the candidate id; objects come from memory
  // (embedding JSON in attributes broke on apostrophes — same fix as desktop).
  const pickFrom = (pool) => async (el) => {
    const printing = (pool || []).find(c => c.id === el.dataset.pick);
    if (!printing) return;
    el.style.opacity = '0.5';
    await jsend(`/api/scans/${scan.id}/select`, 'POST', { printing, ...detailCtl() });
    await renderScanDetail(); refreshScans();
  };
  const candPick = pickFrom(scan.candidates);
  detailBody.querySelectorAll('#pcands .pcard[data-pick]').forEach(el =>
    el.addEventListener('click', () => candPick(el)));

  // live condition/finish/qty edits on an already-selected scan
  if (scan.status === 'selected') {
    ['p-cond','p-fin','p-qty'].forEach(cid => {
      document.getElementById(cid)?.addEventListener('change', async () => {
        await jsend(`/api/scans/${scan.id}`, 'PATCH', detailCtl());
        await renderScanDetail(); refreshScans();
      });
    });
  }

  const doSearch = async () => {
    const q = document.getElementById('p-search').value.trim(); if (!q) return;
    const res = document.getElementById('psearchResults');
    res.innerHTML = `<p style="color:#8b93a1">Searching…</p>`;
    const { candidates } = await (await fetch(`/api/search?q=${encodeURIComponent(q)}`)).json();
    res.innerHTML = candidates.map(c=>pcandCard(c, sel?.scryfall_id)).join('')
      || `<p style="color:#8b93a1">No results.</p>`;
    const searchPick = pickFrom(candidates);
    res.querySelectorAll('.pcard[data-pick]').forEach(el =>
      el.addEventListener('click', () => searchPick(el)));
  };
  document.getElementById('p-searchBtn').addEventListener('click', doSearch);
  document.getElementById('p-search').addEventListener('keydown', e => { if (e.key==='Enter') doSearch(); });

  document.getElementById('p-delete').addEventListener('click', async () => {
    await fetch(`/api/scans/${scan.id}`, { method: 'DELETE' });
    detailPanel.classList.remove('open');
    refreshScans();
  });
}

document.getElementById('detailBack').addEventListener('click', () => {
  detailPanel.classList.remove('open');
  detailScanId = null;
  refreshScans();
});

// ── full-screen image viewer ─────────────────────────────────────────────────
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add('open');
}
lightbox.addEventListener('click', () => lightbox.classList.remove('open'));

startCamera();
</script>
